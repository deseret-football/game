<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deseret Football</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#0d1531; --night2:#122048; --panel:#16295c; --panel2:#1d3570;
    --honey:#edbb00; --honey2:#ffd94d; --parch:#f3eedd; --muted:#93a7d6;
    --line:#2a4383; --grana:#a50044; --cel:#ffd94d; --ter:#c9cdd6; --tel:#d08a4a;
    --win:#5fd08a; --draw:#d9c25e; --loss:#ff6d94;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--night);color:var(--parch);
    font-family:"Open Sans",system-ui,sans-serif;font-size:14px;line-height:1.45;overscroll-behavior:none}
  #app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:70px}
  @media(min-width:768px){#app,nav{max-width:740px}}
  h1,h2,h3{font-weight:800;letter-spacing:.01em;margin:0}
  .gold{color:var(--honey)}.muted{color:var(--muted)}.small{font-size:12px}
  .center{text-align:center}
  table,.big,.scoreline{font-variant-numeric:tabular-nums}
  header{padding:14px 16px 10px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:12px;position:sticky;top:0;background:var(--night);z-index:5}
  .crest{width:38px;height:38px;flex:none}
  header .t{flex:1}
  header h1{font-size:19px;color:var(--honey);line-height:1.1}
  header .sub{font-size:11px;color:var(--muted);margin-top:3px;letter-spacing:.06em;text-transform:uppercase}
  .wrap{padding:14px 14px 20px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
  .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
  .big{font-size:21px;font-weight:800;color:var(--honey2)}
  .stat{flex:1;text-align:center}
  .divider{height:1px;background:var(--line);margin:12px 0}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:8px;font-size:13px}
  .btn{background:linear-gradient(180deg,var(--honey2),var(--honey));color:#241a00;
    font-weight:800;padding:12px 16px;width:100%;letter-spacing:.02em}
  .btn:active{transform:translateY(1px)}
  .btn.sec{background:var(--panel2);color:var(--parch);border:1px solid var(--line);font-weight:600}
  .btn.league{background:linear-gradient(180deg,#ffe27a,#e0b93a);color:#241a00}
  .btn.cup{background:linear-gradient(180deg,#ff8fc0,#d1447f);color:#3a0820}
  .btn.cont{background:linear-gradient(180deg,#7be3a4,#3fa96a);color:#062615}
  .btn.sm{padding:7px 11px;width:auto;font-size:12px}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  select,input[type=text]{background:var(--panel2);color:var(--parch);border:1px solid var(--line);
    border-radius:6px;padding:8px;font-size:13px;width:100%;font-family:inherit}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th{color:var(--muted);font-weight:600;text-align:right;padding:6px 4px;font-size:10px;
    text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--line)}
  th.l,td.l{text-align:left}
  td{padding:7px 4px;text-align:right;border-bottom:1px solid rgba(56,44,96,.4)}
  tr.me td{background:rgba(165,0,68,.30);font-weight:700}
  tr.promo td:first-child{box-shadow:inset 3px 0 0 var(--win)}
  tr.releg td:first-child{box-shadow:inset 3px 0 0 var(--loss)}
  .pos{display:inline-block;width:34px;text-align:center;border-radius:4px;font-size:10px;
    padding:2px 0;font-weight:700}
  .GK{background:#4a3d1f;color:#f0d58a}.DEF{background:#2b3b52;color:#a9cdf0}
  .MID{background:#2e4a33;color:#a7e0b4}.FWD{background:#4d2b3a;color:#f0a9c4}
  .tierbadge{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
  .tier0{color:var(--cel)}.tier1{color:var(--ter)}.tier2{color:var(--tel)}
  .ret{color:#ff8fb3;font-weight:800;font-size:10px;margin-left:3px}
  .injtag{color:var(--loss);font-size:10px;font-weight:700}
  nav{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;
    background:var(--night2);border-top:1px solid var(--line);display:flex;height:66px;z-index:6}
  nav button{flex:1;background:none;color:var(--muted);font-size:9px;font-weight:700;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    text-transform:uppercase;letter-spacing:.04em;border-radius:0}
  nav button .ic{font-size:17px;line-height:1}
  nav button.on{color:var(--honey)}
  .start{padding:22px 18px}
  .teampick{display:flex;justify-content:space-between;align-items:center;padding:11px 12px;
    border:1px solid var(--line);border-radius:8px;margin-bottom:7px;background:var(--panel);cursor:pointer}
  .teampick:active{background:var(--panel2)}
  .badge-lg{display:inline-block;padding:3px 9px;border-radius:5px;font-size:10px;font-weight:700;
    letter-spacing:.08em;text-transform:uppercase;background:var(--grana);color:#fff;border:1px solid transparent}
  .grp-h{font-weight:800;font-size:14px;margin:16px 0 9px;display:flex;align-items:center;gap:8px}
  .slider-row{margin:12px 0}
  .slider-row input{width:100%}
  .ends{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
  .scoreline{font-size:34px;font-weight:800;color:var(--honey2);text-align:center;letter-spacing:.02em}
  .fixt{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid rgba(56,44,96,.4);font-size:12px}
  .res-w{color:var(--win)}.res-d{color:var(--draw)}.res-l{color:var(--loss)}
  .cupfixt{background:rgba(165,0,68,.16);border-left:3px solid var(--grana);padding-left:6px;border-radius:4px}
  .cupmark{font-size:9px;font-weight:800;color:#ff9dc0;letter-spacing:.08em;width:30px}
  .amt-p{color:var(--win)}.amt-n{color:var(--loss)}
  .logline{padding:7px 0;border-bottom:1px solid rgba(56,44,96,.4);font-size:12px;display:flex;gap:8px;justify-content:space-between}
  .stars{color:var(--honey);letter-spacing:1px;font-size:11px}
  .pname{color:var(--honey2);text-decoration:underline;text-decoration-color:rgba(242,201,76,.35);cursor:pointer}
  .overlay{position:fixed;inset:0;background:rgba(5,9,26,.72);z-index:30;display:flex;align-items:flex-end;justify-content:center}
  @media(min-width:768px){.overlay{align-items:center}}
  .pcard{background:var(--panel);border:1px solid var(--line);border-radius:14px 14px 0 0;padding:18px;width:100%;max-width:440px;max-height:82vh;overflow:auto}
  @media(min-width:768px){.pcard{border-radius:14px}}
  .abar{height:8px;background:var(--night2);border-radius:4px;overflow:hidden;flex:1;margin:0 8px}
  .abar>div{height:100%;background:linear-gradient(90deg,var(--grana),var(--honey))}
  .arow{display:flex;align-items:center;font-size:11px;margin:6px 0}
  .arow .al{width:74px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
  .arow .av{width:26px;text-align:right;font-weight:700}
  .toast{position:fixed;bottom:78px;left:50%;transform:translateX(-50%);background:var(--panel2);
    border:1px solid var(--honey);color:var(--parch);padding:10px 16px;border-radius:8px;font-size:12px;z-index:20;max-width:90%}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ========================================================================
   DESERET FOOTBALL v4 — multi-region management sim
   3 regions (Deseret / Kauai / Italian Brainrot) · 3 tiers x 10 clubs each
   ~720 players per region, self-renewing · geo names + 45 nationalities
   Regional cups · Conrad (continental) Cup · World Cup every 4 seasons
   Economy: gate, sponsors, merch, TV, stadium tiers · staff + Chief Scout
   Transfers across regions in a 3-day window · release players anytime
   Saves to this browser via localStorage (auto after each matchday)
   ======================================================================== */

const SAVE_KEY="deseretFootballSave_v4";
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pick=a=>a[ri(0,a.length-1)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=ri(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const money=n=>{const s=n<0?'-':'';n=Math.abs(Math.round(n));
  if(n>=1e6)return s+'£'+(n/1e6).toFixed(n>=1e7?0:1)+'M';
  if(n>=1e3)return s+'£'+Math.round(n/1e3)+'k';return s+'£'+n};

/* ---- Region name pools ---- */
/* ===================== REGIONS · NAMES · COUNTRIES (v4) ===================== */
const REGIONS=[
 {key:"deseret",name:"Deseret",tiers:["Salt Lake","Nauvoo","Kirtland"]},
 {key:"kauai",name:"Kauai",tiers:["Poipu","Napali","Princeville"]},
 {key:"founders",name:"Italian Brainrot",tiers:["Sigma","Rizzler","NPC"]}];
const PER_TIER=10;                       // 10 clubs per tier, 30 per region
const TIER_GLYPH=["\u2600","\u263D","\u2726"];
const TIER_CLS=["tier0","tier1","tier2"];
function regionOf(key){return REGIONS.find(r=>r.key===key);}
function tierName(regionKey,tier){return regionOf(regionKey).tiers[tier];}

const REGION_CLUBS={
 deseret:["Zarahemla City","Nauvoo United","Zion FC","Deseret Saints","Cumorah Athletic",
  "Bountiful Rovers","Kirtland Town","Nephi Wanderers","Manti United","Palmyra FC",
  "Moroni City","Jershon Athletic","Lehi Rovers","Melek Town","Gideon FC",
  "Ammonihah City","Mulek United","Antionum FC","Far West Athletic","Harmony Rovers",
  "Nephihah United","Caminini Bikini","Angry Bippi","Fluffy Tippi FC","Shemlon Town",
  "Amulon Wanderers","Ishmael City","Sam Hayes United","FC Beck","Lowen Athletic"],
 kauai:["Poipu Breakers","Koloa United","Lawai FC","Kalaheo City","Waikomo Rovers",
  "Spouting Horn AC","Kukuiula Town","Poipu Bay FC","Mahaulepu United","Brennecke FC",
  "Napali Cliffs","Hanalei Bay FC","Kalalau United","Haena City","Kee Beach Rovers",
  "Waimea Canyon FC","Kekaha Town","Polihale United","Kalihiwai FC","Anini Athletic",
  "Princeville FC","Hanalei United","Kilauea Town","Anahola Rovers","Kapaa City",
  "Wailua Falls FC","Lihue United","Nawiliwili FC","Kealia Athletic","Moloaa Town"],
 founders:["Tralalero FC","Bombardiro United","Tung Tung City","Cappuccino Rovers","Ballerina Athletic",
  "Lirili Larila FC","Chimpanzini United","Brr Patapim Town","Boneca City","Trippi Troppi United",
  "Crocodilo FC","Sahur Rovers","Bananini City","Assassino United","Frigo Camelo FC",
  "Bombombini Town","Girafa Celeste United","Bri Bri FC","Glorbo Fruttodrillo City","Tigrullini Rovers",
  "Orcalero FC","Trulimero United","Bobrito Bandito Town","Matteo City","Cocofanto FC",
  "Ambalabu United","Pipi Kiwi Rovers","Tracotocutulo FC","Espresso Signora City","Zibra Zubra United"]};
const REGION_EXPANSION={
 deseret:["Shiloh Town","Jacobugath FC","Gimgimno Rovers","Teancum City","Ramah Athletic","Desolation United","Jacob City"],
 kauai:["Hanapepe FC","Eleele United","Kaumakani Town","Puhi FC","Omao Athletic","Kilohana United","Wailua Bay FC"],
 founders:["Rhino Toasterino FC","Cacto Hipopotamo United","Ballerino Lololo Town","Tric Trac Baraboom FC","Pomni Ananas United","Svinino Bombondino Town","Ecco Cavallo FC"]};
const NAMES={
 deseret:{first:["Nephi","Lehi","Jacob","Enos","Mosiah","Benjamin","Alma","Amulek","Ammon","Aaron",
   "Helaman","Corianton","Moroni","Mormon","Ether","Jared","Zeniff","Limhi","Gideon","Abinadi",
   "Pahoran","Teancum","Lachoneus","Samuel","Mathoni","Shemnon","Zeezrom","Nehor","Amaleki","Zoram"],
  last:["Smith","Young","Pratt","Kimball","Snow","Taylor","Woodruff","Cowdery","Whitmer","Rigdon",
   "Cannon","Grant","Richards","Hyde","Benson","Talmage","Roberts","McKay","Eyring","Holland",
   "Maxwell","Packer","Monson","Nelson","Bednar","Uchtdorf","Rasband","Whitney","Bigler","Rockwell"]},
 kauai:{first:["Keanu","Kai","Koa","Ikaika","Makoa","Nainoa","Kekoa","Keoni","Lani","Kaimana",
   "Manu","Nalu","Kanoa","Keahi","Palani","Kawika","Alaka","Hoku","Iolana","Maleko",
   "Noa","Kale","Pika","Aukai","Ekewaka","Haku","Konane","Lono","Makani","Pono"],
  last:["Kahale","Naeole","Kealoha","Akana","Kaohi","Mahoe","Kanahele","Pili","Aiona","Kauhane",
   "Hookano","Naki","Palakiko","Kekona","Akau","Napua","Kalama","Hema","Kaiwi","Makuakane",
   "Opunui","Kahaulelio","Nahale","Kealohi","Aki","Kapua","Lopaka","Malu","Kaeo","Hanohano"]},
 founders:{first:["Tralalero","Bombardiro","Tung","Cappuccino","Ballerina","Lirili","Chimpanzini","Patapim","Boneca","Trippi",
   "Crocodilo","Sahur","Bananini","Assassino","Bombombini","Glorbo","Tigrullini","Orcalero","Trulimero","Bobrito",
   "Cocofanto","Frigo","Girafa","Espresso","Zibra","Pipi","Matteo","Tracotocutulo","Brr","Rhino"],
  last:["Tralala","Crocodilo","Sahur","Assassino","Cappuccina","Larila","Bananini","Patapim","Ambalabu","Troppi",
   "Gusini","Fruttodrillo","Celeste","Bandito","Camelo","Signora","Bicus","Frulli","Toasterino","Zubra",
   "Bombardino","Lololo","Baraboom","Ananas","Cavallo","Kiwi","Milo","Frutti","Sahurini","Tralalelo"]}};
const COUNTRIES=["USA","Canada","Mexico","Argentina","Brazil","France","England","Spain","Portugal","Germany","Netherlands","Italy","Belgium","Croatia","Uruguay","Colombia","Japan","South Korea","Morocco","Senegal","Switzerland","Denmark","Poland","Serbia","Ecuador","Australia","Nigeria","Ghana","Ivory Coast","Cameroon","Egypt","Tunisia","Algeria","Peru","Chile","Paraguay","Sweden","Norway","Austria","Ukraine","Turkey","Greece","Scotland","Wales","Iran"];

const SCOUT_TIERS={   // roster reveal cost per club, resets each season
  none:{label:"No scout",cost:1000000,pot:false,wage:0},
  bronze:{label:"Bronze Scout",cost:400000,pot:true,wage:8000},
  silver:{label:"Silver Scout",cost:250000,pot:true,wage:16000},
  gold:{label:"Gold Scout",cost:100000,pot:true,wage:30000}};
const XFER_PER_OVR=1000000;
const REGION_CUP={deseret:"The Liahona Cup",kauai:"The Napali Cup",founders:"The Brainrot Cup"};
function cupName(regionKey){return REGION_CUP[regionKey||userRegionKey()]||"Regional Cup";}
Object.defineProperty(globalThis,"CUP",{get(){return G&&G.userTeam!=null?cupName(userRegionKey()):"Regional Cup"}});
const CONT_CUP="The Conrad Cup";
const WORLD_CUP="The World Cup";
const SEASON_LEN=18;                      // 10-club double round-robin
const CUP_GROUP_MARKS=[2,4,6,8,10];       // 5 group rounds
const CUP_KO_MARKS=[12,14,16,18];        // 4 knockout rounds (R16 -> final)
const ALL_CUP_MARKS=[...CUP_GROUP_MARKS,...CUP_KO_MARKS];
const KO_NAMES=["Round of 16","Quarterfinal","Semifinal","Final"];
const KO_PRIZE=[250000,500000,900000,1600000];
const GROUP_WIN=40000,GROUP_DRAW=15000,QUALIFY_BONUS=100000;

const FORMATIONS={
 "4-4-2":{DEF:4,MID:4,FWD:2},"4-3-3":{DEF:4,MID:3,FWD:3},
 "3-5-2":{DEF:3,MID:5,FWD:2},"5-3-2":{DEF:5,MID:3,FWD:2},"4-5-1":{DEF:4,MID:5,FWD:1}};
const ATKW={GK:.02,DEF:.15,MID:.55,FWD:1.0};
const DEFW={GK:1.15,DEF:1.0,MID:.45,FWD:.1};

const STAFF_ROLES={
 coach:{name:"Head Coach",desc:"Boosts match performance"},
 fitness:{name:"Fitness Coach",desc:"Fewer injuries"},
 physio:{name:"Physio",desc:"Faster injury recovery"},
 youth:{name:"Youth Coach",desc:"Faster development of under-23s"},
 commercial:{name:"Commercial Director",desc:"Boosts sponsor and merch income"}};
const STAFF_WAGE=[0,2000,5000,10000,18000,30000]; // by stars

/* ---- attribute + rating helpers ---- */
const TILT={
 GK:{pace:-22,shooting:-26,passing:-8,defending:12,physical:6,technique:-4},
 DEF:{pace:2,shooting:-16,passing:-2,defending:15,physical:9,technique:-5},
 MID:{pace:2,shooting:-2,passing:11,defending:-2,physical:-3,technique:9},
 FWD:{pace:9,shooting:15,passing:-2,defending:-18,physical:-3,technique:7}};
const OVR_W={
 GK:{defending:.42,physical:.24,technique:.19,passing:.15},
 DEF:{defending:.4,physical:.24,pace:.15,passing:.11,technique:.1},
 MID:{passing:.3,technique:.26,defending:.14,physical:.15,pace:.15},
 FWD:{shooting:.35,pace:.25,technique:.2,passing:.1,physical:.1}};
/* TILT boosts the very attributes OVR_W weights most, so it used to be counted
   twice and handed every player a free bonus unrelated to potential (up to +8.4
   for forwards). Precompute that premium and subtract it, so a player's OVR
   tracks the age curve and potential is a genuine ceiling. */
const TILT_BIAS={};
for(const _pos in OVR_W){let _b=0;
 for(const _k in OVR_W[_pos])_b+=(TILT[_pos][_k]||0)*OVR_W[_pos][_k];
 TILT_BIAS[_pos]=_b;}
function setOvr(p){p.ovr=Math.min(calcOvr(p),p.pot);return p.ovr;}
const ATTRS=["pace","shooting","passing","defending","physical","technique"];

function ovrFromAge(pot,age){
 const peak=27;let f;
 if(age<=peak)f=.60+.40*(age-16)/(peak-16);
 else f=1-.45*(age-peak)/(40-peak);
 return clamp(pot*f,20,99);}
function calcOvr(p){let o=0;for(const k in OVR_W[p.pos])o+=p[k]*OVR_W[p.pos][k];return Math.round(o);}
function makeAttrs(p){
 const base=ovrFromAge(p.pot,p.age)-(TILT_BIAS[p.pos]||0),t=TILT[p.pos];
 for(const a of ATTRS)p[a]=clamp(Math.round(base+t[a]+rnd(-6,6)),18,99);
 setOvr(p);}
function valueOf(p){
 let v=Math.pow(p.ovr/100,3)*42e6;
 if(p.age<24)v*=1.35;else if(p.age<30)v*=1.15;else if(p.age<34)v*=.75;else v*=.38;
 if(p.pot-p.ovr>10&&p.age<23)v*=1.35;
 return Math.max(40000,Math.round(v/10000)*10000);}
function wageOf(p){return Math.max(500,Math.round(valueOf(p)*.0006/100)*100);}

/* ======================= GAME STATE ======================= */
let G=null;
const PM=new Map();                    // id → player (rebuilt on load)
const P=id=>PM.get(id);
const _TI=new Map();
function rebuildTeamIndex(){_TI.clear();G.teams.forEach(t=>_TI.set(t.id,t));}
const T=id=>_TI.get(id);
function rebuildIndex(){PM.clear();G.players.forEach(p=>PM.set(p.id,p));rebuildTeamIndex();}
function squadOf(t){return t.squad.map(P);}
function squadWage(t){return squadOf(t).reduce((s,p)=>s+p.wage,0);}
function staffWage(){let s=0;for(const r in G.myStaff){const st=G.myStaff[r];if(st)s+=STAFF_WAGE[st.stars]}
 if(G.scoutTier)s+=SCOUT_TIERS[G.scoutTier].wage;
 if(G.superScout)s+=Math.round(SUPER_SCOUT_COST/40); // £5M/yr spread over ~40 pay periods
 return s;}
function myStars(role){const s=G.myStaff&&G.myStaff[role];return s?s.stars:0;}

function newPlayer(id,pos,age,regionKey){
 const rk=regionKey||pick(REGIONS).key;const nm=NAMES[rk];
 const p={id,name:pick(nm.first)+" "+pick(nm.last),pos,age,region:rk,nat:pick(COUNTRIES),
   pot:56+Math.floor(Math.pow(Math.random(),1.6)*43),team:null,inj:0,
   gs:0,gc:0,as:0,ac:0,susp:0,wcWins:0,wcApps:0};
 makeAttrs(p);p.value=valueOf(p);p.wage=wageOf(p);return p;}

function newStaff(id,role){
 const stars=ri(1,5);
 return{id,role,stars,name:pick(NAMES.deseret.first)+" "+pick(NAMES.deseret.last)};}

function genWorld(ownerName){
 let pid=0,tid=0;const clubIdx={};
 const players=[],teams=[],freeAgents=[];
 // per region: build 30 clubs (3 tiers x 10), fill with geo-named players
 REGIONS.forEach((reg,ri_)=>{
   // 720 players per region (600 squads + 120 free agents), even age spread
   const REG_POOL=720;
   const ages=[];while(ages.length<REG_POOL)for(let a=16;a<=40&&ages.length<REG_POOL;a++)ages.push(a);shuffle(ages);
   // draft needs 90 GK / 210 DEF / 180 MID / 120 FWD = 600; rest are free agents
   const posPool=[];const counts={GK:108,DEF:246,MID:216,FWD:150};
   for(const pos in counts)for(let k=0;k<counts[pos];k++)posPool.push(pos);shuffle(posPool);
   const regPlayers=[];
   for(let i=0;i<REG_POOL;i++){const p=newPlayer(pid++,posPool[i],ages[i],reg.key);regPlayers.push(p);players.push(p);}
   // 30 clubs for this region
   const clubTeams=REGION_CLUBS[reg.key].map((name,i)=>{
     const tier=i<10?0:i<20?1:2;
     clubIdx[tid]=i;
     const t={id:tid++,region:reg.key,name,tier,squad:[],
       budget:Math.round(tier===0?rnd(4e6,8e6):tier===1?rnd(1.5e6,3e6):rnd(.6e6,1.2e6)),
       capacity:Math.round(tier===0?rnd(15000,22000):tier===1?rnd(7000,11000):rnd(3000,5500)),
       stadiumLevel:0,building:0,leagueTitles:0,cupTitles:0,contTitles:0,

function makeFixtures(n){

 const m=arr.length,rounds=[];
 for(let r=0;r<m-1;r++){
   const rd=[];
   for(let i=0;i<m/2;i++){
     const h=arr[i],a=arr[m-1-i];
     if(h!==-1&&a!==-1)rd.push(r%2?[a,h]:[h,a]);
   }
   rounds.push(rd);

 }

/* ======================= MATCH ENGINE ======================= */
function fit(list){return list.filter(p=>p.inj<=0&&(p.susp||0)<=0);}
function autoXI(team,formation,useAll){
 const F=FORMATIONS[formation];
 const pool=useAll?squadOf(team):fit(squadOf(team));
 const by=(a,b)=>b.ovr-a.ovr;
 const g=pool.filter(p=>p.pos==="GK").sort(by).slice(0,1);
 const d=pool.filter(p=>p.pos==="DEF").sort(by).slice(0,F.DEF);
 const m=pool.filter(p=>p.pos==="MID").sort(by).slice(0,F.MID);
 const f=pool.filter(p=>p.pos==="FWD").sort(by).slice(0,F.FWD);
 let xi=[...g,...d,...m,...f];
 if(xi.length<11){const used=new Set(xi.map(p=>p.id));
   pool.filter(p=>!used.has(p.id)).sort(by).forEach(p=>{if(xi.length<11)xi.push(p)});}
 if(xi.length<11&&!useAll)return autoXI(team,formation,true);
 return xi;
}
function strength(xi){
 let atk=0,def=0,wa=0,wd=0;
 xi.forEach(p=>{atk+=p.ovr*ATKW[p.pos];wa+=ATKW[p.pos];def+=p.ovr*DEFW[p.pos];wd+=DEFW[p.pos]});
 return{atk:atk/(wa||1),def:def/(wd||1)};
}
function poisson(l){let L=Math.exp(-l),k=0,p=1;do{k++;p*=Math.random()}while(p>L);return k-1;}
const NEU={mentality:50,pressing:50};
const AI_ATT={mentality:72,pressing:62,tempo:68,width:62,line:66};
const AI_DEF={mentality:32,pressing:42,tempo:38,width:40,line:34};
/* ---- club identity: hidden traits for AI clubs, revealed by scouting ---- */
const CLUB_TRAITS={
 selling:{label:"Selling club",desc:"Cashes in on anyone past 27 and accepts below-market fees. A good place to shop."},
 hoarder:{label:"Hoarders",desc:"Demands a heavy premium and clings to its squad. Hard to do business with."},
 youth:{label:"Youth academy",desc:"Develops its under-23s faster than anyone and buys for the future."},
 local:{label:"Local talent",desc:"Signs only players born in its own region."},
 attacking:{label:"Attacking philosophy",desc:"Plays high and fast. Scores freely and concedes freely."},
 defensive:{label:"Defensive philosophy",desc:"Sits deep and grinds out low-scoring games."}};
// weighted by tier: big clubs hoard and have a style, small clubs sell and develop
const TRAIT_WEIGHTS=[
 ["hoarder","hoarder","attacking","attacking","defensive","defensive","youth"],
 ["attacking","defensive","youth","youth","local","selling","hoarder"],
 ["selling","selling","youth","local","local","defensive","attacking"]];
function assignTrait(tier){return pick(TRAIT_WEIGHTS[tier]||TRAIT_WEIGHTS[2]);}
function traitOf(t){return t&&t.trait?CLUB_TRAITS[t.trait]:null;}
const SCORE_W={GK:.01,DEF:.25,MID:1,FWD:2.2};
function attributeGoals(xi,n){
 const scorers=[];
 const w=xi.map(p=>SCORE_W[p.pos]*(p.shooting+p.technique*.4));
 const tot=w.reduce((a,b)=>a+b,0);
 for(let g=0;g<n;g++){
   let r=Math.random()*tot;let k=0;
   while(r>w[k]&&k<w.length-1){r-=w[k];k++}
   const p=xi[k];p.gs=(p.gs||0)+1;p.gc=(p.gc||0)+1;scorers.push(p.name);
 }
 return scorers;
}
function playTie(h,a,adv){
 const hXI=teamXI(h),aXI=teamXI(a);
 const[hg,ag]=simMatch(hXI,aXI,teamTac(h),teamTac(a),teamBoost(h),teamBoost(a),adv);
 [...hXI,...aXI].forEach(p=>{p.as=(p.as||0)+1;p.ac=(p.ac||0)+1});
 return{hg,ag,hs:attributeGoals(hXI,hg),asc:attributeGoals(aXI,ag)};
}
function simMatch(hXI,aXI,hTac,aTac,hBoost,aBoost,homeAdv=3){
 const sH=strength(hXI),sA=strength(aXI);
 const mH=(hTac.mentality-50),mA=(aTac.mentality-50);
 const pH=(hTac.pressing-50),pA=(aTac.pressing-50);
 const tmpH=((hTac.tempo||50)-50),tmpA=((aTac.tempo||50)-50);
 const wdH=((hTac.width||50)-50),wdA=((aTac.width||50)-50);
 const lnH=((hTac.line||50)-50),lnA=((aTac.line||50)-50);
 // tempo: faster = more chances both ways. width: wide = more attack, thinner defense.
 // line: high = presses opponent (cuts their attack) but concedes space in behind.
 const atkH=sH.atk+mH*.08+pH*.04+tmpH*.03+wdH*.03+homeAdv+hBoost;
 const atkA=sA.atk+mA*.08+pA*.04+tmpA*.03+wdA*.03+aBoost;
 const defH=sH.def-Math.max(0,mH)*.05-Math.max(0,pH)*.02-wdH*.03-lnA*.04+lnH*.02+hBoost*.6;
 const defA=sA.def-Math.max(0,mA)*.05-Math.max(0,pA)*.02-wdA*.03-lnH*.04+lnA*.02+aBoost*.6;
 const var_=1+(tmpH+tmpA)/400;   // fast tempo widens score variance
 const xgH=clamp(1.35*var_*Math.exp((atkH-defA)/22),.12,6),
       xgA=clamp(1.12*var_*Math.exp((atkA-defH)/22),.12,6);
 return[poisson(xgH),poisson(xgA)];
}
function teamXI(id){
 return id===G.userTeam?userStartXI():autoXI(T(id),"4-4-2");}
function teamTac(id){
 if(id===G.userTeam)return G.tactics;
 const t=T(id);
 if(t&&t.trait==="attacking")return AI_ATT;
 if(t&&t.trait==="defensive")return AI_DEF;
 return NEU;}
function teamBoost(id){return id===G.userTeam?myStars("coach")*1.1:0;}
function applyResult(h,a,hg,ag){
 const H=T(h).st,A=T(a).st;
 H.P++;A.P++;H.GF+=hg;H.GA+=ag;A.GF+=ag;A.GA+=hg;
 if(hg>ag){H.W++;A.L++;H.Pts+=3}else if(hg<ag){A.W++;H.L++;A.Pts+=3}else{H.D++;A.D++;H.Pts++;A.Pts++}
}

/* ---- economy ---- */
function repOf(t){
 // current form (tier + league position) blended with accumulated prestige.
 // Prestige is deliberately capped at ~a third of reputation so a storied club
 // that falls off still declines, and a newcomer can still rise.
 const tbl=standingsOf(t.region,t.tier),rank=tbl.indexOf(t)+1;
 const form=clamp((2-t.tier)*.28+(PER_TIER-rank)/PER_TIER*.4,0,1);
 const pres=clamp((t.prestige||0)/PRESTIGE_MAX,0,1);
 return clamp(form*0.65+pres*0.35,0,1);}
function effCapacity(t){
 // during construction the club uses a temporary ground at ~55% capacity
 return (t.building>0)?Math.round(t.capacity*0.55):t.capacity;}
function attendance(t){
 const rep=repOf(t);
 const demand=clamp(.45+rep*.5-(G.ticketPrice-25)*.012,.12,1);
 return Math.round(effCapacity(t)*demand);}
const STADIUM_TIERS=[
 {addSeats:6000,cost:6000000,label:"Tier 1 expansion (+6k)"},
 {addSeats:10000,cost:14000000,label:"Tier 2 expansion (+10k)"},
 {addSeats:16000,cost:28000000,label:"Tier 3 expansion (+16k)"}];
function startStadiumBuild(){
 const t=userTeamObj();
 if(t.building>0)return toast("Construction is already under way.");
 if(t.stadiumLevel>=3)return toast("Your stadium is already at maximum size.");
 const plan=STADIUM_TIERS[t.stadiumLevel];
 if(t.budget<plan.cost)return toast(`Need ${money(plan.cost)} to begin.`);
 t.budget-=plan.cost;t.building=1;t.pendingSeats=plan.addSeats;
 logAdd(`Stadium ${plan.label} begun. Playing in a temporary ground this season.`,-plan.cost);
 saveGame(true);render();
}
function sponsorWeekly(t){
 const base=[90000,40000,18000][t.tier];
 return Math.round(base*(1+repOf(t))*(1+.1*myStars("commercial")));}
function merchWeekly(t){
 const sq=squadOf(t);
 const avg=sq.reduce((s,p)=>s+p.ovr,0)/sq.length;
 const stars=sq.filter(p=>p.ovr>=80).length;
 return Math.round((avg*150+stars*9000)*(1+.1*myStars("commercial")));}
function financeTick(home){
 const t=T(G.userTeam);
 const att=home?attendance(t):0;
 const gate=att*G.ticketPrice;
 const spon=sponsorWeekly(t),merch=merchWeekly(t);
 const pw=squadWage(t),sw=staffWage();
 const net=gate+spon+merch-pw-sw;
 const wasOk=t.budget>=0;
 t.budget+=net;
 // the board tracks how long you stay in the red, and acts if you ignore it
 if(t.budget<0){
   G.redWeeks=(G.redWeeks||0)+1;
   if(wasOk)logAdd("The board warns: the club is in the red. Signings are frozen until you balance the books.");
   else if(G.redWeeks===6)logAdd("The board is losing patience. Clear the deficit or they will sell players for you.");
 }else{
   if(G.redWeeks>0)logAdd("The books are balanced again. The transfer embargo is lifted.");
   G.redWeeks=0;
 }
 G.finance={home,att,gate,spon,merch,pw,sw,net};
}
function inTheRed(){return userTeamObj().budget<0;}
function positionNeed(t){
 const tmpl={GK:3,DEF:7,MID:6,FWD:4};
 const have={GK:0,DEF:0,MID:0,FWD:0};
 squadOf(t).forEach(p=>{if(p)have[p.pos]++});
 let worst="MID",gap=-99;
 for(const pos in tmpl){const g=tmpl[pos]-have[pos];if(g>gap){gap=g;worst=pos}}
 return worst;
}
function aiSquadTopUp(){
 // AI clubs lose players to insolvency sales, board sales and trait behaviour
 // with nothing putting them back. Without this, squads bleed down over decades.
 const TARGET=20;
 G.teams.forEach(t=>{
   if(t.id===G.userTeam)return;
   let guard=0;
   while(t.squad.length<TARGET&&guard++<14){
     let pool=G.freeAgents.map(P).filter(Boolean);
     if(!pool.length)break;
     if(t.trait==="local"){const loc=pool.filter(p=>p.region===t.region);if(loc.length)pool=loc;}
     const need=positionNeed(t);
     let cands=pool.filter(p=>p.pos===need);
     if(!cands.length)cands=pool;
     let sign;
     if(t.trait==="youth")sign=cands.sort((a,b)=>(b.pot-b.age*2)-(a.pot-a.age*2))[0];
     else if(t.trait==="selling")sign=cands.sort((a,b)=>a.value-b.value)[0];
     else{
       const afford=cands.filter(p=>p.value<=Math.max(t.budget,0)+400000).sort((a,b)=>b.ovr-a.ovr);
       sign=afford[0]||cands.sort((a,b)=>a.value-b.value)[0];
     }
     if(!sign)break;
     t.budget-=Math.round(sign.value*.5);          // free agents come cheap
     sign.team=t.id;t.squad.push(sign.id);
     G.freeAgents=G.freeAgents.filter(x=>x!==sign.id);
   }
 });
}
function youthAcademyChurn(){
 // youth clubs move a veteran on each summer so the intake has room
 G.teams.forEach(t=>{
   if(t.id===G.userTeam||t.trait!=="youth")return;
   const gks=squadOf(t).filter(x=>x&&x.pos==="GK").length;
   const olds=squadOf(t).filter(p=>p&&p.age>=31&&!(p.pos==="GK"&&gks<=2));
   if(!olds.length)return;
   const p=olds.sort((a,b)=>b.age-a.age)[0];
   t.budget+=Math.round(p.value*.9);
   t.squad=t.squad.filter(x=>x!==p.id);p.team=null;G.freeAgents.push(p.id);
 });
}
function sellingClubSales(){
 // a selling club cashes in its best player past 27 every close season
 G.teams.forEach(t=>{
   if(t.id===G.userTeam||t.trait!=="selling")return;
   if(t.squad.length<=18)return;
   const gks=squadOf(t).filter(x=>x&&x.pos==="GK").length;
   const vets=squadOf(t).filter(p=>p&&p.age>=27&&!(p.pos==="GK"&&gks<=2));
   if(!vets.length)return;
   const p=vets.sort((a,b)=>b.value-a.value)[0];
   t.budget+=Math.round(p.value*.9);
   t.squad=t.squad.filter(x=>x!==p.id);p.team=null;G.freeAgents.push(p.id);
   if(G.news&&((p.gc||0)>=25||p.ovr>=72))
     G.news.unshift({season:G.season,text:`${t.name} cash in again, letting ${p.name} go.`});
 });
}
function boardForcedSales(){
 // season-end enforcement: the board sells your most valuable players until solvent
 const t=userTeamObj();if(t.budget>=0)return;
 let sold=0;
 while(t.budget<0&&t.squad.length>16){
   const pool=squadOf(t).filter(p=>!(p.pos==="GK"&&squadOf(t).filter(x=>x.pos==="GK").length<=2));
   if(!pool.length)break;
   const p=pool.sort((a,b)=>b.value-a.value)[0];
   const fee=Math.round(p.value*.9);
   t.budget+=fee;
   t.squad=t.squad.filter(x=>x!==p.id);p.team=null;G.freeAgents.push(p.id);
   if(G.xi)G.xi=G.xi.filter(id=>id!==p.id);
   logAdd(`The board sold ${p.name} to cover the deficit.`,fee);
   sold++;
 }
 if(sold)G.boardSold=sold;
}

/* ---- light AI weekly economy: keeps rival budgets realistic year-round ---- */
function aiFinanceTick(){
 G.teams.forEach(t=>{
   if(t.id===G.userTeam)return;
   const rep=repOf(t);
   const income=Math.round([70000,32000,15000][t.tier]*(1+rep));

     const p=squadOf(t).sort((a,b)=>b.value-a.value)[0];
     t.budget+=Math.round(p.value*.9);
     t.squad=t.squad.filter(x=>x!==p.id);p.team=null;G.freeAgents.push(p.id);
   }
 });
}

 const t=T(G.userTeam);
 const rep=repOf(t);
 const wageBill=squadWage(t);

 deck.push(()=>{const a=-ri(30,110)*1000;t.budget+=a;

 deck.push(()=>{const a=Math.round(40000+rep*120000);t.budget+=a;

 if(wageBill>[120000,60000,30000][t.tier])
   deck.push(()=>{const a=-Math.round(t.budget*.03);t.budget+=a;
     logAdd("New league legislation: a levy on high wage bills.",a);});

   const bump=Math.round(s.wage*.3);s.wage+=bump;

   logAdd("The board released funds after a favorable audit.",a);});
 deck.push(()=>{const avail=fit(squadOf(t));if(!avail.length)return;
   const p=pick(avail);p.susp=1;
   const fine=-ri(5,20)*1000;t.budget+=fine;
   logAdd(`${p.name} was sent off. Suspended for the next match.`,fine);});
 const ev=pick(deck);ev();
 const last=G.log[0];
 toast(last.text+(last.amt?` (${last.amt>0?'+':''}${money(last.amt)})`:''));

/* ---- AI transfer churn ---- */
function aiTransfers(){
 for(let k=0;k<2;k++){
   const cands=G.teams.filter(t=>t.id!==G.userTeam);
   const t=pick(cands);
   const sq=squadOf(t).filter(p=>p.pos!=="GK").sort((a,b)=>a.ovr-b.ovr);
   const worst=sq[0];if(!worst)continue;
   const sellFee=Math.round(worst.value*.9);
   let options=G.freeAgents.map(P)
     .filter(f=>f.pos===worst.pos&&f.ovr>worst.ovr+2&&f.value<=t.budget+sellFee);
   if(t.trait==="local")options=options.filter(f=>f.region===t.region);
   if(t.trait==="hoarder"&&Math.random()<0.6)continue;   // reluctant to churn
   if(!options.length)continue;
   const buy=t.trait==="youth"
     ? options.sort((a,b)=>(b.pot-b.age*1.5)-(a.pot-a.age*1.5))[0]   // buys for the future
     : options.sort((a,b)=>b.ovr-a.ovr)[0];
   t.budget+=sellFee-buy.value;
   t.squad=t.squad.filter(id=>id!==worst.id);worst.team=null;G.freeAgents.push(worst.id);
   G.freeAgents=G.freeAgents.filter(id=>id!==buy.id);buy.team=t.id;t.squad.push(buy.id);
 }
}

let QUIET=false;
function grTag(r){return "Group Round "+(r+1);}
function initCup(){
 // regional cup: the 30 clubs of the user's region, 6 groups of 5
 const ureg=userRegionKey();
 const seeds=[];
 for(let tier=0;tier<3;tier++)seeds.push(...shuffle(tierClubs(ureg,tier).slice()));
 const groups=Array.from({length:6},()=>[]);
 seeds.forEach((id,i)=>{const r=Math.floor(i/6);const g=r%2?5-(i%6):i%6;groups[g].push(id)});
 // 5-team round robin template (indices 0-4, one bye per round)
 const tmpl=[];let cur=[0,1,2,3,4,-1];
 for(let r=0;r<5;r++){const rd=[];
   for(let i=0;i<3;i++){const h=cur[i],a=cur[5-i];if(h!==-1&&a!==-1)rd.push(r%2?[a,h]:[h,a]);}
   tmpl.push(rd);
   cur=[cur[0],cur[5],...cur.slice(1,5)];}
 const gst={};groups.flat().forEach(id=>gst[id]=blankStd());
 G.cup={phase:"group",groups,tmpl,gst,round:0,
        koAlive:[],koStage:0,log:[],winner:null,userOut:false,userGames:[]};
 if(G.userTeam!==null)cupScheduleUser();

function cupScheduleUser(){
 // pre-schedule the user's group fixtures for the calendar
 const c=G.cup;if(!c||c.userGames.length)return;
 const gi=c.groups.findIndex(g=>g.includes(G.userTeam));
 for(let r=0;r<5;r++){
   const ms=c.tmpl[r].map(([x,y])=>[c.groups[gi][x],c.groups[gi][y]]);
   const mine=ms.find(([h,a])=>h===G.userTeam||a===G.userTeam);
   if(mine)c.userGames.push({md:CUP_GROUP_MARKS[r],round:grTag(r),
     opp:mine[0]===G.userTeam?mine[1]:mine[0],home:mine[0]===G.userTeam,played:false});
   else c.userGames.push({md:CUP_GROUP_MARKS[r],round:grTag(r),rest:true,played:false});
 }
}
function gsort(ids){
 return ids.slice().sort((a,b)=>{const A=G.cup.gst[a],B=G.cup.gst[b];
   return B.Pts-A.Pts||(B.GF-B.GA)-(A.GF-A.GA)||B.GF-A.GF});}
function nextKoUserGame(){

function finishGroups(){

 c.groups.forEach(g=>{const s=gsort(g);qual.push(...s.slice(0,2));fourths.push(s[2]);});
 qual.push(...gsort(fourths).slice(0,4));   // 12 + 4 best third-placed = 16

function cupUserRecord(md,gf,ga,pens){
 const g=G.cup.userGames.find(x=>x.md===md&&!x.rest);
 if(g){g.played=true;g.gf=gf;g.ga=ga;g.pens=!!pens;}
}
function playCupRound(){
 const c=G.cup;if(!c||c.winner!==null)return;
 if(c.phase==="group"){
   const r=c.round;
   c.groups.forEach(grp=>{
     c.tmpl[r].forEach(([x,y])=>{
       const h=grp[x],a=grp[y];
       const{hg,ag}=playTie(h,a,2);
       const H=c.gst[h],A=c.gst[a];
       H.P++;A.P++;H.GF+=hg;H.GA+=ag;A.GF+=ag;A.GA+=hg;
       if(hg>ag){H.W++;A.L++;H.Pts+=3}else if(hg<ag){A.W++;H.L++;A.Pts+=3}else{H.D++;A.D++;H.Pts++;A.Pts++}
       if(h===G.userTeam||a===G.userTeam){
         const home=h===G.userTeam,gf=home?hg:ag,ga=home?ag:hg;
         cupUserRecord(CUP_GROUP_MARKS[r],gf,ga);
         let prize=gf>ga?GROUP_WIN:gf===ga?GROUP_DRAW:0;
         if(prize){T(G.userTeam).budget+=prize;}
         logAdd(`${CUP} ${grTag(r)}: ${T(h).name} ${hg}\u2013${ag} ${T(a).name}.`,prize||0);
         if(!QUIET)toast(`${CUP} ${grTag(r)}: ${T(h).name} ${hg}\u2013${ag} ${T(a).name}${prize?` (+${money(prize)})`:""}`);
       }
     });
   });
   c.round++;
   if(c.round===5)finishGroups();
 }else{
   const al=c.koAlive,winners=[];
   for(let i=0;i<al.length;i+=2){
     const h=al[i],a=al[i+1];
     let{hg,ag}=playTie(h,a,0);
     let pens=false;
     if(hg===ag){pens=true;if(Math.random()<.5)hg++;else ag++;}
     const wnr=hg>ag?h:a;winners.push(wnr);
     const line=`${T(h).name} ${hg}\u2013${ag} ${T(a).name}${pens?" (pens)":""}`;
     c.log.unshift({round:KO_NAMES[c.koStage],line});
     if(h===G.userTeam||a===G.userTeam){
       const home=h===G.userTeam;
       cupUserRecord(CUP_KO_MARKS[c.koStage],home?hg:ag,home?ag:hg,pens);
       if(wnr===G.userTeam){const prize=KO_PRIZE[c.koStage];T(G.userTeam).budget+=prize;
         logAdd(`${CUP}: won the ${KO_NAMES[c.koStage]}.`,prize);
         if(!QUIET)toast(`${CUP} ${KO_NAMES[c.koStage]}: ${line} \u2014 you advance! +${money(prize)}`);}
       else{c.userOut=true;logAdd(`${CUP}: knocked out in the ${KO_NAMES[c.koStage]}.`);
         if(!QUIET)toast(`${CUP} ${KO_NAMES[c.koStage]}: ${line} \u2014 you are out.`);}
     }
   }
   c.koAlive=winners;c.koStage++;
   if(winners.length===1){c.winner=winners[0];
     logAdd(`${T(c.winner).name} lifted ${CUP}.`);}
   else nextKoUserGame();
 }
}

function stockClub(t){
 const tmpl={GK:3,DEF:7,MID:6,FWD:4};
 for(const pos in tmpl){
   let need=tmpl[pos];
   // prefer same-region free agents, then any, then mint geo-aligned youth
   const same=G.freeAgents.map(P).filter(p=>p.pos===pos&&p.region===t.region).sort((a,b)=>a.ovr-b.ovr);
   const any=G.freeAgents.map(P).filter(p=>p.pos===pos&&p.region!==t.region).sort((a,b)=>a.ovr-b.ovr);
   const avail=[...same,...any];
   while(need>0&&avail.length){
     const p=avail.shift();p.team=t.id;t.squad.push(p.id);
     G.freeAgents=G.freeAgents.filter(x=>x!==p.id);need--;
   }
   while(need>0){
     const p=newPlayer(G.nextPid++,pos,ri(18,30),t.region);p.team=t.id;t.squad.push(p.id);G.players.push(p);
     need--;
   }
 }
 rebuildIndex();
}

const PRESTIGE_MAX=100;
function updatePrestige(RT){
 // everything decays a little each season, so past glory fades without new results
 G.teams.forEach(t=>{t.prestige=Math.max(0,(t.prestige||0)*0.94);});
 REGIONS.forEach(r=>{
   RT[r.key].forEach((tbl,tier)=>{
     const weight=[1,0.5,0.25][tier];
     tbl.forEach((t,rank)=>{
       let gain=0;
       if(rank===0)gain=12*weight;            // champions
       else if(rank===1)gain=7*weight;
       else if(rank<PER_TIER/2)gain=3*weight; // respectable top half
       else if(rank>=PER_TIER-2)gain=-2;      // relegation form hurts everywhere
       t.prestige=clamp((t.prestige||0)+gain,0,PRESTIGE_MAX);
     });
   });
 });
 // regional cup winner
 if(G.cup&&G.cup.winner!==null&&T(G.cup.winner))
   T(G.cup.winner).prestige=clamp((T(G.cup.winner).prestige||0)+6,0,PRESTIGE_MAX);
}

function simNations(A,B){
 const diff=A.rating-B.rating;
 const xgA=clamp(1.3*Math.exp(diff/20),.1,6),xgB=clamp(1.3*Math.exp(-diff/20),.1,6);
 let ga=poisson(xgA),gb=poisson(xgB),pens=false;
 if(ga===gb){pens=true;if(Math.random()<1/(1+Math.exp(-diff/8)))ga++;else gb++;}
 return{ga,gb,pens};
}
const WC_XP_CAP=3;              // most a player can gain from one tournament
function awardXP(p,amt){
 // development is for young players: veterans gain nothing from a deep run
 if(p.age>26)return;
 const scaled=Math.min(WC_XP_CAP,Math.ceil(amt/2));
 let left=scaled;const order=shuffle(ATTRS.slice());
 for(const a of order){if(left<=0)break;const add=Math.min(left,1);p[a]=clamp(p[a]+add,18,99);left-=add;}
 setOvr(p);p.value=valueOf(p);p.wage=wageOf(p);
}
function runWorldCup(){
 let nations=COUNTRIES.map(natStrength).filter(Boolean)
   .sort((a,b)=>b.rating-a.rating);
 let field=nations.slice(0,32);
 if(field.length<2){return;}
 let size=1;while(size*2<=field.length)size*=2;
 field=shuffle(field.slice(0,size));
 // squads by country (top 20) + per-player games-played this tournament
 const squads={};const gamesPlayed={};
 field.forEach(n=>{squads[n.country]=n.squad.map(p=>p.id);n.squad.forEach(p=>gamesPlayed[p.id]=0);
   n.core=n.squad.slice(0,14).map(p=>p.id);});   // rotation core actually features
 const roundNames={32:"Round of 32",16:"Round of 16",8:"Quarterfinal",4:"Semifinal",2:"Final"};
 const log=[];let semi=[],finalists=[];
 let alive=field;
 while(alive.length>1){
   const rn=roundNames[alive.length]||("Round of "+alive.length);
   const next=[];
   if(alive.length===4)semi=alive.map(n=>n.country);
   if(alive.length===2)finalists=alive.map(n=>n.country);
   for(let i=0;i<alive.length;i+=2){
     const A=alive[i],B=alive[i+1];
     // both squads log a game played
     (A.core||[]).forEach(id=>gamesPlayed[id]=(gamesPlayed[id]||0)+1);
     (B.core||[]).forEach(id=>gamesPlayed[id]=(gamesPlayed[id]||0)+1);
     const{ga,gb,pens}=simNations(A,B);
     const w=ga>=gb?A:B;next.push(w);
     if(alive.length<=8)log.unshift({round:rn,line:`${A.country} ${ga}\u2013${gb} ${B.country}${pens?" (pens)":""}`});
   }
   alive=next;
 }
 const champ=alive[0].country;
 // XP: more games = more reward (deep runs pay off); winners get a badge
 Object.keys(gamesPlayed).forEach(id=>{
   const p=P(+id);if(!p)return;
   const g=gamesPlayed[id];
   if(g>0)awardXP(p,g);                      // ~1-2 attribute pts per game survived
   p.wcApps=(p.wcApps||0)+g;
 });
 (squads[champ]||[]).forEach(id=>{const p=P(+id);if(p){p.wcWins=(p.wcWins||0)+1;}});
 G.cups.world.push({season:G.season,champion:champ,semifinalists:semi,finalists,
   squads,gamesPlayed,log:log.slice(0,8)});
 G.lastWC={season:G.season,champion:champ,semifinalists:semi,finalists,squads,gamesPlayed,log:log.slice(0,8)};
 logAdd(`\u2691 World Cup won by ${champ}! (Semifinalists: ${semi.join(", ")})`);
}
function ageAndRenew(){
 const retiring=[];
 const youthStars=myStars("youth");
 G.players.forEach(p=>{
   p.age++;p.inj=0;p.susp=0;p.gs=0;p.as=0;
   // Scale attributes by how far the age curve moved this year, NOT by target/ovr.
   // Dividing by the weighted ovr stripped each player's positional tilt on their
   // first birthday, permanently deflating the whole world by ~6 OVR after season 1.
   const prev=ovrFromAge(p.pot,Math.min(Math.max(p.age-1,16),40));
   const target=ovrFromAge(p.pot,Math.min(p.age,40));
   const scale=target/Math.max(1,prev);
   ATTRS.forEach(a=>p[a]=clamp(Math.round(p[a]*scale+rnd(-1,1)),18,99));
   // youth coach: extra growth for user's under-23s
   if(youthStars&&p.team===G.userTeam&&p.age<23)
     ATTRS.forEach(a=>p[a]=clamp(p[a]+ri(0,Math.ceil(youthStars/2)),18,99));
   // youth academy clubs develop their own prospects faster
   const _c=p.team!=null?T(p.team):null;
   if(_c&&_c.trait==="youth"&&_c.id!==G.userTeam&&p.age<23)
     ATTRS.forEach(a=>p[a]=clamp(p[a]+ri(0,2),18,99));
   setOvr(p);p.value=valueOf(p);p.wage=wageOf(p);
   if(p.age>40)retiring.push(p);
 });
 retiring.forEach(old=>{
   const kid=newPlayer(G.nextPid++,old.pos,16,old.region);
   const homeTeam=old.team!==null?T(old.team):null;
   if(homeTeam){
     homeTeam.squad=homeTeam.squad.filter(x=>x!==old.id);
     kid.team=old.team;homeTeam.squad.push(kid.id);
     if(old.team===G.userTeam)logAdd(`${old.name} retired. Youth prospect ${kid.name} joins the squad.`);
   }else{G.freeAgents=G.freeAgents.filter(x=>x!==old.id);kid.team=null;G.freeAgents.push(kid.id)}
   G.players=G.players.filter(x=>x.id!==old.id);
   G.players.push(kid);
 });
 // soft cap: if the pool drifted above target, retire surplus unattached free agents
 const TARGET=REGIONS.length*760;   // small headroom over 720/region
 if(G.players.length>TARGET){
   const cutN=G.players.length-TARGET;
   const cuttable=G.freeAgents.map(P).filter(Boolean)
     .sort((a,b)=>(b.age-a.age)||(a.ovr-b.ovr));   // oldest, weakest first
   const cut=new Set(cuttable.slice(0,cutN).map(p=>p.id));
   if(cut.size){
     G.players=G.players.filter(p=>!cut.has(p.id));
     G.freeAgents=G.freeAgents.filter(id=>!cut.has(id));
   }
 }
 rebuildIndex();
}

function inWindow(){return G.matchday===0&&G.window&&G.window.day<=3;}
function scoutInfo(){return SCOUT_TIERS[G.scoutTier||"none"];}
function isScouted(id){return !!(G.scouted&&G.scouted[id]);}
function scoutCost(){return scoutInfo().cost;}
function canSeePot(teamId){
 if(teamId===G.userTeam)return true;
 return isScouted(teamId)&&scoutInfo().pot;
}
function buyScout(teamId){
 const cost=scoutCost();const t=userTeamObj();
 if(t.budget<cost)return toast("Not enough budget to scout them.");
 t.budget-=cost;G.scouted[teamId]=true;
 logAdd(`Scouted ${T(teamId).name} for the season.`,-cost);

}
function transferFee(p){
 // Headline is OVR x £1M, but the fee shifts with age and potential so a
 // young, high-ceiling player costs well above an aging one at the same OVR.
 const base=p.ovr*XFER_PER_OVR;
 let mult=1;
 if(p.age<=21)mult=1.30; else if(p.age<=25)mult=1.12; else if(p.age<=29)mult=1.0;
 else if(p.age<=32)mult=0.78; else if(p.age<=35)mult=0.55; else mult=0.38;
 if(p.pot-p.ovr>=10&&p.age<24)mult*=1.15;      // wonderkid premium
 // the selling club's identity moves the asking price
 const seller=p.team!=null?T(p.team):null;
 if(seller&&seller.id!==G.userTeam){
   if(seller.trait==="selling")mult*=0.75;      // motivated seller
   if(seller.trait==="hoarder")mult*=1.65;      // will not be moved cheaply
   if(seller.trait==="youth"&&p.age<24)mult*=1.35;  // protects its prospects
 }
 return Math.max(500000,Math.round(base*mult/100000)*100000);
}
function buyPlayer(p){
 const t=userTeamObj();
 if(!inWindow())return toast("Trades only happen in the pre-season window.");
 if(p.team===null)return signPlayer(p);
 if(G.window.offersMade>=2)return toast("Only 2 moves per window day. Advance the day.");
 const fee=transferFee(p);
 if(inTheRed())return toast("Signings are frozen while the club is in the red.");
 if(t.budget<fee)return toast(`Need ${money(fee)} for this transfer.`);
 if(t.squad.length>=30)return toast("Squad is full (30 max).");
 const seller=T(p.team);
 t.budget-=fee;seller.budget+=fee;
 seller.squad=seller.squad.filter(x=>x!==p.id);
 p.team=t.id;t.squad.push(p.id);
 G.window.offersMade++;
 logAdd(`Signed ${p.name} from ${seller.name} for ${money(fee)}.`,-fee);
 toast(`Signed ${p.name} for ${money(fee)}.`);saveGame(true);render();
}
function genOffers(){
 // AI bids for your best players, one batch per window day
 G.offers=[];const t=userTeamObj();
 const targets=squadOf(t).sort((a,b)=>b.ovr-a.ovr).slice(0,6);
 const n=ri(1,3);
 for(let k=0;k<n;k++){
   const p=pick(targets);if(!p)break;
   if(G.offers.find(o=>o.pid===p.id))continue;
   const buyer=pick(G.teams.filter(x=>x.id!==G.userTeam&&x.tier<=p_tierPref(p)));
   if(!buyer)continue;
   const premium=rnd(.9,1.4);
   G.offers.push({pid:p.id,from:buyer.id,fee:Math.round(transferFee(p)*premium)});
 }
}
function p_tierPref(p){return p.ovr>=80?0:p.ovr>=68?1:2;}
const SUPER_SCOUT_COST=5000000;
function buildSuperShortlist(){
 // proactive scout scours all regions for value: young, high-ceiling, affordable-ish
 const t=userTeamObj();if(!t)return;
 const pool=G.players.filter(p=>p.team!==null&&p.team!==G.userTeam&&(p.pot-p.ovr>=6||p.age<=23));
 const scored=pool.map(p=>({p,score:p.pot*1.4+(p.pot-p.ovr)*2+(28-Math.min(p.age,28))*1.5+p.ovr*0.5}))
   .sort((a,b)=>b.score-a.score);
 // spread across positions so the list is useful
 const byPos={GK:[],DEF:[],MID:[],FWD:[]};
 scored.forEach(s=>{if(byPos[s.p.pos].length<4)byPos[s.p.pos].push(s.p.id)});
 const list=[...byPos.GK.slice(0,1),...byPos.DEF.slice(0,3),...byPos.MID.slice(0,3),...byPos.FWD.slice(0,3)];
 G.superShort=list;
 // super-scout also reveals potential on these players' clubs for free this season
 list.forEach(pid=>{const pl=P(pid);if(pl&&pl.team!==null)G.scouted[pl.team]=true});
}
function acceptOffer(o){
 const t=userTeamObj();const p=P(o.pid);
 if(!p||p.team!==G.userTeam)return;
 if(t.squad.length<=16)return toast("Cannot sell below 16 players.");
 if(p.pos==="GK"&&squadOf(t).filter(x=>x.pos==="GK").length<=2)return toast("Keep at least 2 keepers.");
 const buyer=T(o.from);
 t.budget+=o.fee;buyer.budget-=o.fee;
 t.squad=t.squad.filter(x=>x!==p.id);p.team=buyer.id;buyer.squad.push(p.id);
 if(G.xi)G.xi=G.xi.filter(id=>id!==p.id);
 G.offers=G.offers.filter(x=>x!==o);
 logAdd(`Sold ${p.name} to ${buyer.name} for ${money(o.fee)}.`,o.fee);
 toast(`Sold ${p.name} for ${money(o.fee)}.`);saveGame(true);render();
}

function signPlayer(p){
 const t=userTeamObj();
 if(inTheRed())return toast("Signings are frozen while the club is in the red.");
 if(t.budget<p.value)return toast("Not enough in the budget.");
 if(t.squad.length>=30)return toast("Squad is full (30 max).");
 t.budget-=p.value;G.freeAgents=G.freeAgents.filter(x=>x!==p.id);
 p.team=t.id;t.squad.push(p.id);
 logAdd(`Signed ${p.name}.`,-p.value);
 toast(`Signed ${p.name} for ${money(p.value)}.`);saveGame(true);render();
}
function releasePlayer(p){
 const t=userTeamObj();
 if(!p||p.team!==G.userTeam)return;
 if(t.squad.length<=16)return toast("Cannot go below 16 players.");
 if(p.pos==="GK"&&squadOf(t).filter(x=>x.pos==="GK").length<=2)return toast("Keep at least 2 keepers.");
 if(!confirm(`Release ${p.name}? They leave for free and their wage comes off the books.`))return;
 t.squad=t.squad.filter(x=>x!==p.id);p.team=null;G.freeAgents.push(p.id);
 if(G.xi)G.xi=G.xi.filter(id=>id!==p.id);
 logAdd(`Released ${p.name}.`);
 toast(`${p.name} released.`);saveGame(true);render();
}

let WORLD_TEAM=null;let WORLD_REGION=null;
function viewWorld(w){
 if(WORLD_TEAM!==null&&G.teams.find(t=>t.id===WORLD_TEAM)){viewWorldTeam(w,WORLD_TEAM);return;}
 WORLD_TEAM=null;
 const sc=$(`<div class="card"></div>`);
 sc.appendChild($(`<h3 style="font-size:15px;margin-bottom:4px">Clubs of the world</h3>
   <div class="small muted" style="margin-bottom:6px">Tap a club to view trophies, scorers, and scout their squad. Scout status: <b class="gold">${scoutInfo().label}</b>.</div>`));
 w.appendChild(sc);
 if(WORLD_REGION===null)WORLD_REGION=userRegionKey();
 const rt=$(`<div class="row" style="gap:4px;margin-bottom:6px"></div>`);
 REGIONS.forEach(r=>{
   const b=$(`<button class="btn sm ${WORLD_REGION===r.key?'':'sec'}" style="flex:1">${r.name}${r.key===userRegionKey()?' \u2605':''}</button>`);
   b.onclick=()=>{WORLD_REGION=r.key;render()};rt.appendChild(b);
 });
 w.appendChild(rt);
 const gb=$(`<button class="btn sm ${WORLD_REGION==="global"?'':'sec'}" style="width:100%;margin-bottom:10px">\u2605 Prestige across the universe</button>`);
 gb.onclick=()=>{WORLD_REGION=WORLD_REGION==="global"?userRegionKey():"global";render()};
 w.appendChild(gb);

 if(WORLD_REGION==="global"){
   const gl=globalPrestige();
   const hd=$(`<div class="card"></div>`);
   hd.appendChild($(`<h3 style="font-size:15px;margin-bottom:4px">Prestige across the universe</h3>
     <div class="small muted">All ${gl.length} clubs from every region, ranked by standing. Tap any club to view it.</div>`));
   w.appendChild(hd);
   const rows=gl.map((t,i)=>{
     const cls=t.id===G.userTeam?"me":"";
     return `<tr class="${cls}" data-club="${t.id}"><td class="l muted">${i+1}</td>`+
       `<td class="l">${t.name}${t.id===G.userTeam?' <span class="pill">you</span>':''}</td>`+
       `<td class="l small muted">${regionOf(t.region).name}</td>`+
       `<td class="l small muted">${tierName(t.region,t.tier)}</td>`+
       `<td class="gold"><b>${Math.round(t.prestige||0)}</b></td>`+
       `<td class="l small muted">${prestigeLabel(t.prestige||0)}</td></tr>`;
   }).join("");
   const tb=$(`<div class="card" style="padding:8px 10px"><table><thead><tr>
     <th class="l">#</th><th class="l">Club</th><th class="l">Region</th><th class="l">Division</th>
     <th>Prestige</th><th class="l"></th></tr></thead><tbody>${rows}</tbody></table></div>`);
   tb.querySelectorAll("[data-club]").forEach(r=>r.onclick=()=>{WORLD_TEAM=+r.dataset.club;render()});
   w.appendChild(tb);
   return;
 }
 [0,1,2].forEach(tier=>{
   w.appendChild($(tierHead(WORLD_REGION,tier)));
   const list=$(`<div class="card" style="padding:6px 8px"></div>`);
   standingsOf(WORLD_REGION,tier).forEach(t=>{
     const row=$(`<div class="teampick" style="margin-bottom:4px">
       <div><b>${t.name}</b>${t.id===G.userTeam?' <span class="pill">you</span>':''}
       <div class="small muted">\u2691 ${t.leagueTitles||0} \u00B7 \u2726 ${t.cupTitles||0}${(t.contTitles||0)?' \u00B7 \u2b50 '+t.contTitles:''} \u00B7 ${prestigeLabel(t.prestige||0)} ${Math.round(t.prestige||0)}${isScouted(t.id)?' \u00B7 scouted':''}</div></div>
       <span class="badge-lg">View</span></div>`);
     row.onclick=()=>{WORLD_TEAM=t.id;render()};
     list.appendChild(row);
   });
   w.appendChild(list);
 });
}
function viewWorldTeam(w,id){
 const t=T(id);const me=id===G.userTeam;
 const back=$(`<button class="btn sec sm" style="margin-bottom:10px">\u2190 All clubs</button>`);
 back.onclick=()=>{WORLD_TEAM=null;render()};w.appendChild(back);
 w.appendChild($(`<div class="card"><div class="row"><h2 style="font-size:19px">${t.name}</h2>${tierTag(t)}</div>
   <div class="small muted">${regionOf(t.region).name} \u00B7 ${(t.capacity/1000).toFixed(0)}k seats \u00B7 ${money(t.budget)} budget</div>
   <div class="small" style="margin-top:4px">Prestige: <b class="gold">${prestigeLabel(t.prestige||0)}</b> (${Math.round(t.prestige||0)}/100) \u00B7 ${prestigeRank(t.id,globalPrestige())} of ${G.teams.length} in the universe</div></div>`));
 if(!me){
   const tc=$(`<div class="card"></div>`);
   tc.appendChild($(`<h3 style="font-size:15px;margin-bottom:4px">Club identity</h3>`));
   if(isScouted(id)&&traitOf(t))
     tc.appendChild($(`<div class="small"><b class="gold">${traitOf(t).label}</b></div>
       <div class="small muted" style="margin-top:3px">${traitOf(t).desc}</div>`));
   else
     tc.appendChild($(`<div class="small muted">Unknown. Scout this club to learn how they do business.</div>`));
   w.appendChild(tc);
 }
 w.appendChild(trophyCard(t));
 w.appendChild(goalLeaderCard(squadOf(t),"Top scorers (career)"));

 if(me){w.appendChild($(`<div class="card small muted center">This is your club. Manage it from the Squad and Market tabs.</div>`));return;}

 // scouting gate
 const seen=isScouted(id);
 const sInfo=scoutInfo();
 if(!seen){
   const sc=$(`<div class="card center"></div>`);
   sc.appendChild($(`<div class="small" style="margin-bottom:8px">Their squad is hidden. Scout them to reveal the roster${sInfo.pot?" and player potential":""} for the rest of this season.</div>`));
   const b=$(`<button class="btn">Scout squad \u00B7 ${money(sInfo.cost)}</button>`);
   b.disabled=userTeamObj().budget<sInfo.cost;
   b.onclick=()=>buyScout(id);sc.appendChild(b);
   if(!sInfo.pot)sc.appendChild($(`<div class="small muted" style="margin-top:6px">Without a scout on staff you can see names and ratings, but not potential. Hire a Bronze, Silver or Gold scout in the Office.</div>`));
   w.appendChild(sc);
   return;
 }

 // roster revealed
 const open=inWindow();
 const rc=$(`<div class="card"></div>`);
 rc.appendChild($(`<h3 style="font-size:15px;margin-bottom:4px">Squad</h3>
   <div class="small muted" style="margin-bottom:6px">Transfer fee = OVR \u00D7 ${money(XFER_PER_OVR)}. ${open?`Window Day ${G.window.day}, ${2-G.window.offersMade} moves left.`:"Buying opens in the pre-season window."}</div>`));
 const showPot=sInfo.pot;
 const rows=squadOf(t).sort((a,b)=>b.ovr-a.ovr).map(p=>{
   const fee=transferFee(p);
   const can=open&&G.window.offersMade<2&&userTeamObj().budget>=fee&&userTeamObj().squad.length<30;
   return `<tr><td class="l"><span class="pname" data-p="${p.id}">${p.name}</span></td>`+
     `<td><span class="pos ${p.pos}">${p.pos}</span></td><td>${ageCell(p)}</td>`+
     `<td class="gold">${p.ovr}</td><td class="muted">${showPot?p.pot:"?"}</td>`+
     `<td>${money(fee)}</td>`+
     `<td><button class="btn sm ${can?'':'sec'}" data-buy="${p.id}" ${can?'':'disabled'}>Buy</button></td></tr>`;
 }).join("");
 const rt=$(`<table><thead><tr><th class="l">Player</th><th></th><th>Age</th><th>OVR</th><th>POT</th><th>Fee</th><th></th></tr></thead><tbody>${rows}</tbody></table>`);
 rt.querySelectorAll("[data-buy]").forEach(b=>b.onclick=e=>{e.stopPropagation();buyPlayer(P(+b.dataset.buy))});
 wireNames(rt);rc.appendChild(rt);
 w.appendChild(rc);
}

/* boot */
if(loadGame()&&G.userTeam!==null){TAB="club";render()}
else{G=null;renderStart()}
</script>
</body>
</html>
