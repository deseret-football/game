<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deseret Football</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#161228; --night2:#1e1838; --panel:#241d44; --panel2:#2b2350;
    --honey:#e0a93a; --honey2:#f2c94c; --parch:#ece3cf; --muted:#9a8fbf;
    --line:#382c60; --cel:#e8b53a; --ter:#c9cdd6; --tel:#c17f3e;
    --win:#5fd08a; --draw:#cbb96e; --loss:#df7c9a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--night);color:var(--parch);
    font-family:"Open Sans",system-ui,sans-serif;font-size:14px;line-height:1.45;overscroll-behavior:none}
  #app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:70px}
  @media(min-width:768px){#app,nav{max-width:740px}}
  h1,h2,h3{font-weight:800;letter-spacing:.01em;margin:0}
  .gold{color:var(--honey)}.muted{color:var(--muted)}.small{font-size:12px}
  .center{text-align:center}
  table,.big,.scoreline{font-variant-numeric:tabular-nums}
  header{padding:14px 16px 10px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:12px;position:sticky;top:0;background:var(--night);z-index:5}
  .crest{width:38px;height:38px;flex:none}
  header .t{flex:1}
  header h1{font-size:19px;color:var(--honey);line-height:1.1}
  header .sub{font-size:11px;color:var(--muted);margin-top:3px;letter-spacing:.06em;text-transform:uppercase}
  .wrap{padding:14px 14px 20px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
  .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
  .big{font-size:21px;font-weight:800;color:var(--honey2)}
  .stat{flex:1;text-align:center}
  .divider{height:1px;background:var(--line);margin:12px 0}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:8px;font-size:13px}
  .btn{background:linear-gradient(180deg,var(--honey2),var(--honey));color:#2a1e05;
    font-weight:800;padding:12px 16px;width:100%;letter-spacing:.02em}
  .btn:active{transform:translateY(1px)}
  .btn.sec{background:var(--panel2);color:var(--parch);border:1px solid var(--line);font-weight:600}
  .btn.sm{padding:7px 11px;width:auto;font-size:12px}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  select,input[type=text]{background:var(--panel2);color:var(--parch);border:1px solid var(--line);
    border-radius:6px;padding:8px;font-size:13px;width:100%;font-family:inherit}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th{color:var(--muted);font-weight:600;text-align:right;padding:6px 4px;font-size:10px;
    text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--line)}
  th.l,td.l{text-align:left}
  td{padding:7px 4px;text-align:right;border-bottom:1px solid rgba(56,44,96,.4)}
  tr.me td{background:rgba(224,169,58,.12);font-weight:700}
  tr.promo td:first-child{box-shadow:inset 3px 0 0 var(--win)}
  tr.releg td:first-child{box-shadow:inset 3px 0 0 var(--loss)}
  .pos{display:inline-block;width:34px;text-align:center;border-radius:4px;font-size:10px;
    padding:2px 0;font-weight:700}
  .GK{background:#4a3d1f;color:#f0d58a}.DEF{background:#2b3b52;color:#a9cdf0}
  .MID{background:#2e4a33;color:#a7e0b4}.FWD{background:#4d2b3a;color:#f0a9c4}
  .tierbadge{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
  .tier0{color:var(--cel)}.tier1{color:var(--ter)}.tier2{color:var(--tel)}
  .ret{color:var(--loss);font-weight:800;font-size:10px;margin-left:3px}
  .injtag{color:var(--loss);font-size:10px;font-weight:700}
  nav{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;
    background:var(--night2);border-top:1px solid var(--line);display:flex;height:66px;z-index:6}
  nav button{flex:1;background:none;color:var(--muted);font-size:9px;font-weight:700;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    text-transform:uppercase;letter-spacing:.04em;border-radius:0}
  nav button .ic{font-size:17px;line-height:1}
  nav button.on{color:var(--honey)}
  .start{padding:22px 18px}
  .teampick{display:flex;justify-content:space-between;align-items:center;padding:11px 12px;
    border:1px solid var(--line);border-radius:8px;margin-bottom:7px;background:var(--panel);cursor:pointer}
  .teampick:active{background:var(--panel2)}
  .badge-lg{display:inline-block;padding:3px 9px;border-radius:5px;font-size:10px;font-weight:700;
    letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line)}
  .grp-h{font-weight:800;font-size:14px;margin:16px 0 9px;display:flex;align-items:center;gap:8px}
  .slider-row{margin:12px 0}
  .slider-row input{width:100%}
  .ends{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
  .scoreline{font-size:34px;font-weight:800;color:var(--honey2);text-align:center;letter-spacing:.02em}
  .fixt{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid rgba(56,44,96,.4);font-size:12px}
  .res-w{color:var(--win)}.res-d{color:var(--draw)}.res-l{color:var(--loss)}
  .amt-p{color:var(--win)}.amt-n{color:var(--loss)}
  .logline{padding:7px 0;border-bottom:1px solid rgba(56,44,96,.4);font-size:12px;display:flex;gap:8px;justify-content:space-between}
  .stars{color:var(--honey);letter-spacing:1px;font-size:11px}
  .toast{position:fixed;bottom:78px;left:50%;transform:translateX(-50%);background:var(--panel2);
    border:1px solid var(--honey);color:var(--parch);padding:10px 16px;border-radius:8px;font-size:12px;z-index:20;max-width:90%}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ========================================================================
   DESERET FOOTBALL v2 — Restoration-themed management sim
   3 tiers (Celestial/Terrestrial/Telestial) · 15 clubs each · 20 players/club
   1000-player pool, ages 16-40 (40/age), self-renewing · The Liahona Cup
   Economy: gate, sponsors, merch, TV · Staff market · Events · AI trading
   Saves to this browser via localStorage (auto after each matchday)
   ======================================================================== */

const SAVE_KEY="deseretFootballSave_v2";
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pick=a=>a[ri(0,a.length-1)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=ri(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const money=n=>{const s=n<0?'-':'';n=Math.abs(Math.round(n));
  if(n>=1e6)return s+'£'+(n/1e6).toFixed(n>=1e7?0:1)+'M';
  if(n>=1e3)return s+'£'+Math.round(n/1e3)+'k';return s+'£'+n};

/* ---- Restoration name pools ---- */
const FIRST=["Nephi","Lehi","Sam","Jacob","Enos","Jarom","Omni","Mosiah","Benjamin","Alma",
"Amulek","Ammon","Aaron","Omner","Himni","Helaman","Shiblon","Corianton","Moroni","Mormon",
"Ether","Jared","Mahonri","Zeniff","Limhi","Gideon","Abinadi","Pahoran","Teancum","Lachoneus",
"Samuel","Jonas","Mathoni","Kumen","Shemnon","Isaiah","Zeezrom","Nehor","Amaleki","Chemish",
"Coriantumr","Shiz","Lib","Kib","Seth","Zoram","Laman","Lemuel","Giddonah","Antipus",
"Cezoram","Pacumeni","Nephihah","Gidgiddoni","Timothy","Josh","Ammaron","Amos","Jeremiah","Ezrom"];
const LAST=["Smith","Young","Pratt","Kimball","Snow","Taylor","Woodruff","Cowdery","Whitmer","Rigdon",
"Harris","Knight","Partridge","Cannon","Grant","Richards","Hyde","Page","Wells","Lyman",
"Benson","Clawson","Ballard","Talmage","Roberts","Widtsoe","McKay","Bennion","Eyring","Holland",
"Maxwell","Packer","Monson","Nelson","Bednar","Cook","Uchtdorf","Andersen","Rasband","Stevenson",
"Whitney","Sherman","Carter","Johnson","Marsh","Hancock","Boynton","Lyon","Bigler","Rockwell"];

const CLUBS=[
"Zarahemla City","Nauvoo United","Zion FC","Deseret Saints","Cumorah Athletic",
"Bountiful Rovers","Kirtland Town","Nephi Wanderers","Manti United","Palmyra FC",
"Moroni City","Jershon Athletic","Lehi Rovers","Melek Town","Gideon FC",
"Ammonihah City","Mulek United","Antionum FC","Far West Athletic","Harmony Rovers",
"Fayette Town","Sidon Wanderers","Helam City","Middoni United","Onidah FC",
"Shilom Athletic","Jashon Rovers","Minon Town","Noah Wanderers","Boaz City",
"Nephihah United","Antiparah FC","Judea Athletic","Cumeni Rovers","Shemlon Town",
"Amulon Wanderers","Ishmael City","Midian United","Angola FC","Sidom Athletic",
"Carthage Rovers","Adam-ondi FC","Cove Fort Town","Parowan Wanderers","Kanab City"];

const TIERS=[
 {name:"Celestial League",glyph:"\u2600",cls:"tier0"},
 {name:"Terrestrial League",glyph:"\u263D",cls:"tier1"},
 {name:"Telestial League",glyph:"\u2726",cls:"tier2"}];
const CUP="The Liahona Cup";
const CUP_ROUNDS=["First Round","Round of 32","Round of 16","Quarterfinal","Semifinal","Final"];
const CUP_MARKS=[5,10,15,20,25,30];       // cup round plays after these matchdays
const CUP_PRIZE=[60000,120000,250000,500000,900000,1600000];

const FORMATIONS={
 "4-4-2":{DEF:4,MID:4,FWD:2},"4-3-3":{DEF:4,MID:3,FWD:3},
 "3-5-2":{DEF:3,MID:5,FWD:2},"5-3-2":{DEF:5,MID:3,FWD:2},"4-5-1":{DEF:4,MID:5,FWD:1}};
const ATKW={GK:.02,DEF:.15,MID:.55,FWD:1.0};
const DEFW={GK:1.15,DEF:1.0,MID:.45,FWD:.1};

const STAFF_ROLES={
 coach:{name:"Head Coach",desc:"Boosts match performance"},
 fitness:{name:"Fitness Coach",desc:"Fewer injuries"},
 physio:{name:"Physio",desc:"Faster injury recovery"},
 youth:{name:"Youth Coach",desc:"Faster development of under-23s"},
 scout:{name:"Scout",desc:"Reveals player potential in the market"},
 commercial:{name:"Commercial Director",desc:"Boosts sponsor and merch income"}};
const STAFF_WAGE=[0,2000,5000,10000,18000,30000]; // by stars

/* ---- attribute + rating helpers ---- */
const TILT={
 GK:{pace:-22,shooting:-26,passing:-8,defending:12,physical:6,technique:-4},
 DEF:{pace:2,shooting:-16,passing:-2,defending:15,physical:9,technique:-5},
 MID:{pace:2,shooting:-2,passing:11,defending:-2,physical:-3,technique:9},
 FWD:{pace:9,shooting:15,passing:-2,defending:-18,physical:-3,technique:7}};
const OVR_W={
 GK:{defending:.42,physical:.24,technique:.19,passing:.15},
 DEF:{defending:.4,physical:.24,pace:.15,passing:.11,technique:.1},
 MID:{passing:.3,technique:.26,defending:.14,physical:.15,pace:.15},
 FWD:{shooting:.35,pace:.25,technique:.2,passing:.1,physical:.1}};
const ATTRS=["pace","shooting","passing","defending","physical","technique"];

function ovrFromAge(pot,age){
 const peak=27;let f;
 if(age<=peak)f=.60+.40*(age-16)/(peak-16);
 else f=1-.45*(age-peak)/(40-peak);
 return clamp(pot*f,20,99);}
function calcOvr(p){let o=0;for(const k in OVR_W[p.pos])o+=p[k]*OVR_W[p.pos][k];return Math.round(o);}
function makeAttrs(p){
 const base=ovrFromAge(p.pot,p.age),t=TILT[p.pos];
 for(const a of ATTRS)p[a]=clamp(Math.round(base+t[a]+rnd(-6,6)),18,99);
 p.ovr=calcOvr(p);}
function valueOf(p){
 let v=Math.pow(p.ovr/100,3)*42e6;
 if(p.age<24)v*=1.35;else if(p.age<30)v*=1.15;else if(p.age<34)v*=.75;else v*=.38;
 if(p.pot-p.ovr>10&&p.age<23)v*=1.35;
 return Math.max(40000,Math.round(v/10000)*10000);}
function wageOf(p){return Math.max(500,Math.round(valueOf(p)*.0006/100)*100);}

/* ======================= GAME STATE ======================= */
let G=null;
const PM=new Map();                    // id → player (rebuilt on load)
const P=id=>PM.get(id);
const T=id=>G.teams[id];
function rebuildIndex(){PM.clear();G.players.forEach(p=>PM.set(p.id,p));}
function squadOf(t){return t.squad.map(P);}
function squadWage(t){return squadOf(t).reduce((s,p)=>s+p.wage,0);}
function staffWage(){let s=0;for(const r in G.myStaff){const st=G.myStaff[r];if(st)s+=STAFF_WAGE[st.stars]}return s;}
function myStars(role){const s=G.myStaff&&G.myStaff[role];return s?s.stars:0;}

function newPlayer(id,pos,age){
 const p={id,name:pick(FIRST)+" "+pick(LAST),pos,age,
   pot:48+Math.floor(Math.pow(Math.random(),1.6)*47),team:null,inj:0};
 makeAttrs(p);p.value=valueOf(p);p.wage=wageOf(p);return p;}

function newStaff(id,role){
 const stars=ri(1,5);
 return{id,role,stars,name:pick(FIRST)+" "+pick(LAST)};}

function genWorld(ownerName){
 let pid=0;
 const players=[];
 const ages=[];for(let a=16;a<=40;a++)for(let k=0;k<40;k++)ages.push(a);shuffle(ages);
 const posPool=[];const counts={GK:150,DEF:330,MID:330,FWD:190};
 for(const pos in counts)for(let k=0;k<counts[pos];k++)posPool.push(pos);shuffle(posPool);
 for(let i=0;i<1000;i++)players.push(newPlayer(pid++,posPool[i],ages[i]));

 const teams=CLUBS.map((name,i)=>({
   id:i,name,tier:i<15?0:i<30?1:2,squad:[],
   budget:Math.round(i<15?rnd(4e6,8e6):i<30?rnd(1.5e6,3e6):rnd(.6e6,1.2e6)),
   capacity:Math.round(i<15?rnd(15000,22000):i<30?rnd(7000,11000):rnd(3000,5500)),
   st:blankStd()}));

 const tmpl={GK:3,DEF:7,MID:6,FWD:4};const freeAgents=[];
 for(const pos in tmpl){
   const cnt=tmpl[pos];
   const list=players.filter(p=>p.pos===pos).sort((a,b)=>b.ovr-a.ovr);
   const per=15*cnt;
   for(let tier=0;tier<3;tier++){
     const block=list.slice(tier*per,tier*per+per);
     block.forEach((p,i)=>{const t=tier*15+(i%15);p.team=t;teams[t].squad.push(p.id)});
   }
   list.slice(3*per).forEach(p=>{p.team=null;freeAgents.push(p.id)});
 }
 const staffPool=[];for(let i=0;i<48;i++)staffPool.push(newStaff(i,pick(Object.keys(STAFF_ROLES))));

 G={ver:2,owner:ownerName||"President",nextPid:pid,
    players,teams,freeAgents,staffPool,myStaff:{},
    userTeam:null,season:1,matchday:0,
    tierTeams:[[],[],[]],fixtures:makeFixtures(15),lastResults:null,
    formation:"4-4-2",xi:null,tactics:{mentality:50,pressing:50},
    ticketPrice:20,finance:null,log:[],history:[],cup:null};
 rebuildIndex();rebuildTierTeams();initCup();
}
function blankStd(){return{P:0,W:0,D:0,L:0,GF:0,GA:0,Pts:0}}
function rebuildTierTeams(){
 G.tierTeams=[[],[],[]];
 G.teams.forEach(t=>G.tierTeams[t.tier].push(t.id));
}
function makeFixtures(n){
 let arr=[...Array(n).keys()];if(n%2)arr.push(-1);
 const m=arr.length,rounds=[];
 for(let r=0;r<m-1;r++){
   const rd=[];
   for(let i=0;i<m/2;i++){
     const h=arr[i],a=arr[m-1-i];
     if(h!==-1&&a!==-1)rd.push(r%2?[a,h]:[h,a]);
   }
   rounds.push(rd);
   arr=[arr[0],arr[m-1],...arr.slice(1,m-1)];
 }
 return rounds.concat(rounds.map(rd=>rd.map(([h,a])=>[a,h])));
}

/* ======================= SAVE / LOAD ======================= */
function saveGame(silent){
 try{localStorage.setItem(SAVE_KEY,JSON.stringify(G));
   if(!silent)toast("Game saved.");return true;}
 catch(e){if(!silent)toast("Save failed. Browser storage may be blocked.");return false;}
}
function loadGame(){
 try{const raw=localStorage.getItem(SAVE_KEY);if(!raw)return false;
   const g=JSON.parse(raw);if(!g||g.ver!==2)return false;
   G=g;rebuildIndex();return true;}
 catch(e){return false;}
}
function wipeSave(){try{localStorage.removeItem(SAVE_KEY)}catch(e){}}

/* ======================= MATCH ENGINE ======================= */
function fit(list){return list.filter(p=>p.inj<=0);}
function autoXI(team,formation,useAll){
 const F=FORMATIONS[formation];
 const pool=useAll?squadOf(team):fit(squadOf(team));
 const by=(a,b)=>b.ovr-a.ovr;
 const g=pool.filter(p=>p.pos==="GK").sort(by).slice(0,1);
 const d=pool.filter(p=>p.pos==="DEF").sort(by).slice(0,F.DEF);
 const m=pool.filter(p=>p.pos==="MID").sort(by).slice(0,F.MID);
 const f=pool.filter(p=>p.pos==="FWD").sort(by).slice(0,F.FWD);
 let xi=[...g,...d,...m,...f];
 if(xi.length<11){const used=new Set(xi.map(p=>p.id));
   pool.filter(p=>!used.has(p.id)).sort(by).forEach(p=>{if(xi.length<11)xi.push(p)});}
 if(xi.length<11&&!useAll)return autoXI(team,formation,true);
 return xi;
}
function strength(xi){
 let atk=0,def=0,wa=0,wd=0;
 xi.forEach(p=>{atk+=p.ovr*ATKW[p.pos];wa+=ATKW[p.pos];def+=p.ovr*DEFW[p.pos];wd+=DEFW[p.pos]});
 return{atk:atk/wa,def:def/wd};
}
function poisson(l){let L=Math.exp(-l),k=0,p=1;do{k++;p*=Math.random()}while(p>L);return k-1;}
const NEU={mentality:50,pressing:50};
function simMatch(hXI,aXI,hTac,aTac,hBoost,aBoost,homeAdv=3){
 const sH=strength(hXI),sA=strength(aXI);
 const mH=(hTac.mentality-50),mA=(aTac.mentality-50);
 const pH=(hTac.pressing-50),pA=(aTac.pressing-50);
 const atkH=sH.atk+mH*.08+pH*.04+homeAdv+hBoost;
 const atkA=sA.atk+mA*.08+pA*.04+aBoost;
 const defH=sH.def-Math.max(0,mH)*.05-Math.max(0,pH)*.02+hBoost*.6;
 const defA=sA.def-Math.max(0,mA)*.05-Math.max(0,pA)*.02+aBoost*.6;
 const xgH=clamp(1.35*Math.exp((atkH-defA)/22),.12,5.5);
 const xgA=clamp(1.12*Math.exp((atkA-defH)/22),.12,5.5);
 return[poisson(xgH),poisson(xgA)];
}
function teamXI(id){
 return id===G.userTeam?userStartXI():autoXI(T(id),"4-4-2");}
function teamTac(id){return id===G.userTeam?G.tactics:NEU;}
function teamBoost(id){return id===G.userTeam?myStars("coach")*1.1:0;}
function applyResult(h,a,hg,ag){
 const H=T(h).st,A=T(a).st;
 H.P++;A.P++;H.GF+=hg;H.GA+=ag;A.GF+=ag;A.GA+=hg;
 if(hg>ag){H.W++;A.L++;H.Pts+=3}else if(hg<ag){A.W++;H.L++;A.Pts+=3}else{H.D++;A.D++;H.Pts++;A.Pts++}
}

/* ======================= MATCHDAY LOOP ======================= */
function logAdd(text,amt){
 G.log.unshift({s:G.season,md:G.matchday,text,amt:amt||0});
 if(G.log.length>60)G.log.length=60;
}
function playMatchday(){
 // heal one matchday of injuries first
 G.players.forEach(p=>{if(p.inj>0)p.inj--});
 const fx=G.fixtures[G.matchday],out=[];
 let userHome=null;
 for(let tier=0;tier<3;tier++){
   const tt=G.tierTeams[tier];
   fx.forEach(([i,j])=>{
     const h=tt[i],a=tt[j];
     if(h===G.userTeam)userHome=true;if(a===G.userTeam)userHome=false;
     const[hg,ag]=simMatch(teamXI(h),teamXI(a),teamTac(h),teamTac(a),teamBoost(h),teamBoost(a));
     applyResult(h,a,hg,ag);
     out.push({tier,h,a,hg,ag});
   });
 }
 G.lastResults=out;G.matchday++;
 financeTick(userHome===true);
 maybeInjury();
 maybeEvent();
 aiTransfers();
 if(CUP_MARKS.includes(G.matchday))playCupRound();
 saveGame(true);
}

/* ---- economy ---- */
function repOf(t){
 const tbl=standingsOf(t.tier),rank=tbl.indexOf(t)+1;
 return clamp((2-t.tier)*.28+(15-rank)/15*.4,0,1);}
function attendance(t){
 const rep=repOf(t);
 const demand=clamp(.45+rep*.5-(G.ticketPrice-25)*.012,.12,1);
 return Math.round(t.capacity*demand);}
function sponsorWeekly(t){
 const base=[90000,40000,18000][t.tier];
 return Math.round(base*(1+repOf(t))*(1+.1*myStars("commercial")));}
function merchWeekly(t){
 const sq=squadOf(t);
 const avg=sq.reduce((s,p)=>s+p.ovr,0)/sq.length;
 const stars=sq.filter(p=>p.ovr>=80).length;
 return Math.round((avg*150+stars*9000)*(1+.1*myStars("commercial")));}
function financeTick(home){
 const t=T(G.userTeam);
 const att=home?attendance(t):0;
 const gate=att*G.ticketPrice;
 const spon=sponsorWeekly(t),merch=merchWeekly(t);

/* ---- AI transfer churn ---- */
function aiTransfers(){
 for(let k=0;k<2;k++){
   const cands=G.teams.filter(t=>t.id!==G.userTeam);
   const t=pick(cands);
   const sq=squadOf(t).filter(p=>p.pos!=="GK").sort((a,b)=>a.ovr-b.ovr);
   const worst=sq[0];if(!worst)continue;
   const sellFee=Math.round(worst.value*.9);
   const options=G.freeAgents.map(P)
     .filter(f=>f.pos===worst.pos&&f.ovr>worst.ovr+2&&f.value<=t.budget+sellFee);
   if(!options.length)continue;
   const buy=options.sort((a,b)=>b.ovr-a.ovr)[0];
   t.budget+=sellFee-buy.value;
   t.squad=t.squad.filter(id=>id!==worst.id);worst.team=null;G.freeAgents.push(worst.id);
   G.freeAgents=G.freeAgents.filter(id=>id!==buy.id);buy.team=t.id;t.squad.push(buy.id);
 }
}

/* ======================= THE LIAHONA CUP ======================= */
function initCup(){
 // seed by tier, shuffled within tier; top 19 seeds get first-round byes
 const seeds=[];
 for(let tier=0;tier<3;tier++)seeds.push(...shuffle(G.tierTeams[tier].slice()));
 const byes=seeds.slice(0,19);
 const entrants=shuffle(seeds.slice(19));
 const ties=[];for(let i=0;i<entrants.length;i+=2)ties.push([entrants[i],entrants[i+1]]);
 G.cup={stage:0,alive:byes.slice(),pending:ties,userOut:false,winner:null,log:[]};
}
function playCupRound(){
 const c=G.cup;if(!c||c.winner!==null)return;
 let ties;
 if(c.stage===0){ties=c.pending;}
 else{
   const pool=shuffle(c.alive.slice());c.alive=[];
   ties=[];for(let i=0;i<pool.length;i+=2)ties.push([pool[i],pool[i+1]]);
 }
 const winners=[];
 ties.forEach(([h,a])=>{
   let[hg,ag]=simMatch(teamXI(h),teamXI(a),teamTac(h),teamTac(a),teamBoost(h),teamBoost(a),0);
   let note="";
   if(hg===ag){const penH=Math.random()<.5;note=" (pens)";if(penH)hg++;else ag++;}
   const w=hg>ag?h:a;
   winners.push(w);
   const line=`${T(h).name} ${hg}–${ag} ${T(a).name}${note}`;
   c.log.unshift({round:CUP_ROUNDS[c.stage],line});
   if(h===G.userTeam||a===G.userTeam){
     const won=w===G.userTeam;
     if(won){const prize=CUP_PRIZE[c.stage];T(G.userTeam).budget+=prize;
       logAdd(`${CUP}: won the ${CUP_ROUNDS[c.stage]}.`,prize);
       toast(`${CUP} ${CUP_ROUNDS[c.stage]}: ${line} — you advance! +${money(prize)}`);}
     else{c.userOut=true;logAdd(`${CUP}: knocked out in the ${CUP_ROUNDS[c.stage]}.`);
       toast(`${CUP} ${CUP_ROUNDS[c.stage]}: ${line} — you are out.`);}
   }
 });
 if(c.stage===0)winners.push(...c.alive);  // 19 byes join the 13 winners = 32
 c.alive=winners;
 c.stage++;
 if(c.alive.length===1){
   c.winner=c.alive[0];
   logAdd(`${T(c.winner).name} lifted ${CUP}.`);
 }
}

/* ======================= SEASON TURNOVER ======================= */
function standingsOf(tier){
 return G.tierTeams[tier].map(id=>T(id))
   .sort((x,y)=>y.st.Pts-x.st.Pts||(y.st.GF-y.st.GA)-(x.st.GF-x.st.GA)||y.st.GF-x.st.GF);
}
function endSeason(){
 const tables=[0,1,2].map(standingsOf);
 const promoted=new Set(),relegated=new Set();
 const base=[8e6,3e6,1.2e6];
 tables.forEach((tbl,tier)=>tbl.forEach((t,r)=>{
   const tv=base[tier]+(15-r)*200000;
   if(t.id===G.userTeam){t.budget+=tv;logAdd("Season TV and prize money received.",tv);}
   else t.budget+=tv-squadWage(t)*30;
 }));
 tables[0].slice(12).forEach(t=>{t.tier=1;relegated.add(t.id)});
 tables[1].slice(0,3).forEach(t=>{t.tier=0;promoted.add(t.id);t.budget+=3e6});
 tables[1].slice(12).forEach(t=>{t.tier=2;relegated.add(t.id)});
 tables[2].slice(0,3).forEach(t=>{t.tier=1;promoted.add(t.id);t.budget+=1.5e6});

 const ut=T(G.userTeam);
 const myTable=tables[[0,1,2].find(x=>G.tierTeams[x].includes(G.userTeam))];
 const myRank=myTable.indexOf(ut)+1;
 G.history.push({season:G.season,tier:ut.tier,rank:myRank,
   champ:tables[0][0].name,
   cup:G.cup&&G.cup.winner!==null?T(G.cup.winner).name:"—",
   promo:promoted.has(G.userTeam),releg:relegated.has(G.userTeam)});

 ageAndRenew();
 G.teams.forEach(t=>t.st=blankStd());
 rebuildTierTeams();
 G.matchday=0;G.season++;G.lastResults=null;G.xi=null;
 initCup();
 saveGame(true);
}
function ageAndRenew(){
 const retiring=[];
 const youthStars=myStars("youth");
 G.players.forEach(p=>{
   p.age++;p.inj=0;
   const target=ovrFromAge(p.pot,Math.min(p.age,40));
   const scale=target/Math.max(1,p.ovr);
   ATTRS.forEach(a=>p[a]=clamp(Math.round(p[a]*scale+rnd(-1,1)),18,99));
   // youth coach: extra growth for user's under-23s
   if(youthStars&&p.team===G.userTeam&&p.age<23)
     ATTRS.forEach(a=>p[a]=clamp(p[a]+ri(0,Math.ceil(youthStars/2)),18,99));
   p.ovr=calcOvr(p);p.value=valueOf(p);p.wage=wageOf(p);
   if(p.age>40)retiring.push(p);
 });
 retiring.forEach(old=>{
   const kid=newPlayer(G.nextPid++,old.pos,16);
   if(old.team!==null){
     const t=T(old.team);t.squad=t.squad.filter(x=>x!==old.id);
     kid.team=old.team;t.squad.push(kid.id);
     if(old.team===G.userTeam)logAdd(`${old.name} retired. Youth prospect ${kid.name} joins the squad.`);
   }else{G.freeAgents=G.freeAgents.filter(x=>x!==old.id);kid.team=null;G.freeAgents.push(kid.id)}
   G.players=G.players.filter(x=>x.id!==old.id);
   G.players.push(kid);
 });
 rebuildIndex();
}

 w.appendChild(leagueTable(tier,true));
 const fc=$(`<div class="card" style="margin-top:12px"></div>`);
 fc.appendChild($(`<h3 style="font-size:15px;margin-bottom:8px">Your season</h3>`));
 const tt=G.tierTeams[tier],li=tt.indexOf(G.userTeam);
 G.fixtures.forEach((rd,md)=>{
   const pair=rd.find(([i,j])=>i===li||j===li);if(!pair)return;
   const home=pair[0]===li;const opp=T(tt[home?pair[1]:pair[0]]);
   const played=md<G.matchday;
   fc.appendChild($(`<div class="fixt">
     <span class="muted" style="width:26px">${md+1}</span>
     <span style="width:14px" class="small muted">${home?'H':'A'}</span>
     <span style="flex:1">${opp.name}</span>
     <span class="${played?'gold':'muted'} small">${played?'played':'\u2014'}</span></div>`));
 });
 w.appendChild(fc);
}
function leagueTable(tier,mark){
 const tbl=standingsOf(tier);
 const t=$(`<div class="card" style="padding:8px 10px"><table><thead><tr>
   <th class="l">#</th><th class="l">Club</th><th>P</th><th>W</th><th>D</th><th>L</th>
   <th>GD</th><th>Pts</th></tr></thead><tbody></tbody></table></div>`);
 const tb=t.querySelector("tbody");
 tbl.forEach((tm,i)=>{
   const gd=tm.st.GF-tm.st.GA;
   let cls=tm.id===G.userTeam&&mark?"me ":"";
   if(tier<2&&i<3)cls+="promo";else if(tier>0&&i>=12)cls+="releg";
   tb.appendChild($(`<tr class="${cls}">
     <td class="l muted">${i+1}</td><td class="l">${tm.name}</td>
     <td>${tm.st.P}</td><td>${tm.st.W}</td><td>${tm.st.D}</td><td>${tm.st.L}</td>
     <td class="${gd>0?'res-w':gd<0?'res-l':''}">${gd>0?'+':''}${gd}</td>
     <td class="gold"><b>${tm.st.Pts}</b></td></tr>`));
 });
 return t;
}

/* ---------- TRANSFERS ---------- */
let MKT_SORT="ovr";
function viewTransfers(w){
 const t=userTeamObj();
 w.appendChild($(`<div class="card row">
   <div><div class="lbl">Transfer budget</div><div class="big">${money(t.budget)}</div></div>
   <div class="center"><div class="lbl">Squad</div><div class="big">${t.squad.length}</div></div></div>`));

 const sc=$(`<div class="card"></div>`);
 sc.appendChild($(`<h3 style="font-size:15px;margin-bottom:6px">Sell from your squad</h3>
   <div class="small muted" style="margin-bottom:8px">Sales bring 90% of value. Keep 16+ players and 2+ keepers. <span class="ret">R</span> players retire at year's end — sell now or lose the fee.</div>`));
 const stab=$(`<table><thead><tr><th class="l">Player</th><th></th><th>Age</th><th>OVR</th><th>Value</th><th></th></tr></thead><tbody></tbody></table>`);
 squadOf(t).sort((a,b)=>b.value-a.value).forEach(p=>{
   const row=$(`<tr><td class="l">${p.name}</td><td><span class="pos ${p.pos}">${p.pos}</span></td>
     <td>${ageCell(p)}</td><td class="gold">${p.ovr}</td><td>${money(p.value)}</td><td></td></tr>`);
   const b=$(`<button class="btn sm sec">Sell</button>`);
   b.onclick=()=>sellPlayer(p);row.lastElementChild.appendChild(b);
   stab.querySelector("tbody").appendChild(row);
 });
 sc.appendChild(stab);w.appendChild(sc);

 const hasScout=myStars("scout")>0;
 const mc=$(`<div class="card"></div>`);
 mc.appendChild($(`<div class="row" style="margin-bottom:6px"><h3 style="font-size:15px">Free agents (${G.freeAgents.length})</h3></div>`));
 if(!hasScout)mc.appendChild($(`<div class="small muted" style="margin-bottom:6px">Hire a Scout in the Office to reveal potential (POT).</div>`));
 const sortSel=$(`<select style="margin-bottom:8px"></select>`);
 [["ovr","Rating"],["pot","Potential"],["value","Value (low\u2192high)"],["age","Age (young\u2192old)"]]
   .forEach(([k,l])=>sortSel.appendChild($(`<option value="${k}" ${k===MKT_SORT?'selected':''}>${l}</option>`)));
 sortSel.onchange=()=>{MKT_SORT=sortSel.value;render()};
 mc.appendChild(sortSel);
 let fa=G.freeAgents.map(P);
 fa.sort((a,b)=> MKT_SORT==="value"?a.value-b.value : MKT_SORT==="age"?a.age-b.age : b[MKT_SORT]-a[MKT_SORT]);
 fa=fa.slice(0,40);
 const ftab=$(`<table><thead><tr><th class="l">Player</th><th></th><th>Age</th><th>OVR</th><th>POT</th><th>Fee</th><th></th></tr></thead><tbody></tbody></table>`);
 fa.forEach(p=>{
   const row=$(`<tr><td class="l">${p.name}</td><td><span class="pos ${p.pos}">${p.pos}</span></td>
     <td>${ageCell(p)}</td><td class="gold">${p.ovr}</td>
     <td class="muted">${hasScout?p.pot:"?"}</td>
     <td>${money(p.value)}</td><td></td></tr>`);
   const b=$(`<button class="btn sm ${t.budget>=p.value?'':'sec'}">Sign</button>`);
   b.disabled=t.budget<p.value||t.squad.length>=30;
   b.onclick=()=>signPlayer(p);row.lastElementChild.appendChild(b);
   ftab.querySelector("tbody").appendChild(row);
 });
 mc.appendChild(ftab);w.appendChild(mc);
}
function signPlayer(p){
 const t=userTeamObj();
 if(t.budget<p.value)return toast("Not enough in the budget.");
 if(t.squad.length>=30)return toast("Squad is full (30 max).");
 t.budget-=p.value;G.freeAgents=G.freeAgents.filter(x=>x!==p.id);
 p.team=t.id;t.squad.push(p.id);
 logAdd(`Signed ${p.name}.`,-p.value);
 toast(`Signed ${p.name} for ${money(p.value)}.`);saveGame(true);render();
}
function sellPlayer(p){
 const t=userTeamObj();
 if(t.squad.length<=16)return toast("Cannot go below 16 players.");
 if(p.pos==="GK"&&squadOf(t).filter(x=>x.pos==="GK").length<=2)return toast("Keep at least 2 keepers.");
 const fee=Math.round(p.value*.9);t.budget+=fee;
 t.squad=t.squad.filter(x=>x!==p.id);p.team=null;G.freeAgents.push(p.id);
 if(G.xi)G.xi=G.xi.filter(id=>id!==p.id);
 logAdd(`Sold ${p.name}.`,fee);
 toast(`Sold ${p.name} for ${money(fee)}.`);saveGame(true);render();
}

/* ---------- OFFICE ---------- */
function viewOffice(w){
 const t=userTeamObj();
 // finance
 const fc=$(`<div class="card"></div>`);
 fc.appendChild($(`<h3 style="font-size:15px;margin-bottom:6px">Finances</h3>`));
 if(G.finance){
   const f=G.finance;
   const line=(l,v)=>`<div class="logline"><span>${l}</span><span class="${v>=0?'amt-p':'amt-n'}">${v>=0?'+':''}${money(v)}</span></div>`;
   fc.appendChild($(`<div>
     ${f.home?line(`Gate (${f.att.toLocaleString()} \u00D7 \u00A3${G.ticketPrice})`,f.gate):`<div class="logline"><span>Gate</span><span class="muted">away week</span></div>`}
     ${line("Sponsorship",f.spon)}
     ${line("Merchandise",f.merch)}
     ${line("Player wages",-f.pw)}
     ${line("Staff wages",-f.sw)}
     <div class="logline" style="font-weight:800"><span>Net last matchday</span>
       <span class="${f.net>=0?'amt-p':'amt-n'}">${f.net>=0?'+':''}${money(f.net)}</span></div></div>`));
 }else fc.appendChild($(`<div class="small muted">Play a matchday to see the weekly ledger.</div>`));
 fc.appendChild($(`<div class="slider-row">
   <div class="ends"><span>Ticket \u00A35</span><span>\u00A360</span></div></div>`));
 const tp=$(`<input type="range" min="5" max="60" value="${G.ticketPrice}">`);
 const tpl=$(`<div class="small center">Ticket price: <b class="gold">\u00A3${G.ticketPrice}</b> \u00B7 est. attendance ${attendance(t).toLocaleString()}/${t.capacity.toLocaleString()}</div>`);
 tp.oninput=()=>{G.ticketPrice=+tp.value;
   tpl.innerHTML=`Ticket price: <b class="gold">\u00A3${G.ticketPrice}</b> \u00B7 est. attendance ${attendance(t).toLocaleString()}/${t.capacity.toLocaleString()}`};
 fc.querySelector(".slider-row").appendChild(tp);
 fc.appendChild(tpl);
 w.appendChild(fc);

 // staff
 const stc=$(`<div class="card"></div>`);
 stc.appendChild($(`<h3 style="font-size:15px;margin-bottom:6px">Staff</h3>
   <div class="small muted" style="margin-bottom:8px">One hire per role. Wages by quality: \u2605 ${money(STAFF_WAGE[1])}/wk up to \u2605\u2605\u2605\u2605\u2605 ${money(STAFF_WAGE[5])}/wk.</div>`));
 for(const role in STAFF_ROLES){
   const mine=G.myStaff[role];
   const box=$(`<div style="margin-bottom:10px">
     <div class="row"><b class="small">${STAFF_ROLES[role].name}</b>
     <span class="small muted">${STAFF_ROLES[role].desc}</span></div></div>`);
   if(mine){
     const r=$(`<div class="row" style="margin-top:4px"><span class="small">${mine.name} ${stars(mine.stars)} \u00B7 ${money(STAFF_WAGE[mine.stars])}/wk</span></div>`);
     const fire=$(`<button class="btn sm sec">Release</button>`);
     fire.onclick=()=>{G.staffPool.push(mine);G.myStaff[role]=null;saveGame(true);render()};
     r.appendChild(fire);box.appendChild(r);
   }else{
     const avail=G.staffPool.filter(s=>s.role===role).sort((a,b)=>b.stars-a.stars).slice(0,3);
     if(!avail.length)box.appendChild($(`<div class="small muted">No candidates available right now.</div>`));
     avail.forEach(s=>{
       const r=$(`<div class="row" style="margin-top:4px"><span class="small">${s.name} ${stars(s.stars)} \u00B7 ${money(STAFF_WAGE[s.stars])}/wk</span></div>`);
       const hire=$(`<button class="btn sm">Hire</button>`);
       hire.onclick=()=>{G.myStaff[role]=s;G.staffPool=G.staffPool.filter(x=>x.id!==s.id);
         logAdd(`Hired ${s.name} as ${STAFF_ROLES[role].name}.`);saveGame(true);render()};
       r.appendChild(hire);box.appendChild(r);
     });
   }
   stc.appendChild(box);
 }
 w.appendChild(stc);

 // event log
 const lc=$(`<div class="card"></div>`);
 lc.appendChild($(`<h3 style="font-size:15px;margin-bottom:6px">Club log</h3>`));
 if(!G.log.length)lc.appendChild($(`<div class="small muted">Nothing yet. News lands here as the season unfolds.</div>`));
 G.log.slice(0,20).forEach(e=>{
   lc.appendChild($(`<div class="logline"><span>S${e.s} MD${e.md} \u00B7 ${e.text}</span>
     ${e.amt?`<span class="${e.amt>0?'amt-p':'amt-n'}">${e.amt>0?'+':''}${money(e.amt)}</span>`:''}</div>`));
 });
 w.appendChild(lc);

 // save controls
 const sc=$(`<div class="card"></div>`);
 sc.appendChild($(`<h3 style="font-size:15px;margin-bottom:6px">Save</h3>
   <div class="small muted" style="margin-bottom:8px">Auto-saves after every matchday to this browser on this device.</div>`));
 const sv=$(`<button class="btn" style="margin-bottom:8px">Save now</button>`);
 sv.onclick=()=>saveGame(false);
 sc.appendChild(sv);
 const del=$(`<button class="btn sec">Delete save and start over</button>`);
 del.onclick=()=>{if(confirm("Delete your save and start a new game?")){wipeSave();G=null;renderStart()}};
 sc.appendChild(del);
 w.appendChild(sc);
}

/* ---------- WORLD ---------- */
function viewWorld(w){
 const c=G.cup;
 const cc=$(`<div class="card"></div>`);
 cc.appendChild($(`<h3 class="center" style="font-size:15px;color:var(--honey)">${CUP}</h3>`));
 const status=c.winner!==null
   ?`<b class="gold">${T(c.winner).name}</b> are the champions`
   :`${c.alive.length+(c.stage===0?c.pending.length*2:0)} clubs remain \u00B7 next: ${CUP_ROUNDS[Math.min(c.stage,5)]} after matchday ${CUP_MARKS[Math.min(c.stage,5)]}`;
 cc.appendChild($(`<div class="center small" style="margin:4px 0 8px">${status}</div>`));
 c.log.slice(0,8).forEach(e=>cc.appendChild($(`<div class="logline"><span class="muted">${e.round}</span><span>${e.line}</span></div>`)));
 w.appendChild(cc);
 [0,1,2].forEach(tier=>{
   w.appendChild($(`<div class="grp-h ${TIERS[tier].cls}">${TIERS[tier].glyph} ${TIERS[tier].name}</div>`));
   w.appendChild(leagueTable(tier,true));
 });
 if(G.history.length){
   const hc=$(`<div class="card"></div>`);
   hc.appendChild($(`<h3 style="font-size:15px;margin-bottom:6px">Honours history</h3>`));
   G.history.slice().reverse().forEach(h=>{
     hc.appendChild($(`<div class="logline"><span>Season ${h.season}</span>
       <span class="small">League: <span class="gold">${h.champ}</span> \u00B7 Cup: <span class="gold">${h.cup}</span></span></div>`));
   });
   w.appendChild(hc);
 }
}

/* boot */
if(loadGame()&&G.userTeam!==null){TAB="club";render()}
else{G=null;renderStart()}
</script>
</body>
</html>
